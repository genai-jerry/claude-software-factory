name: Factory test harness

# Caller stub — PILOT ONLY. Lets you exercise factory roles from Actions before
# the pipeline stub is merged to the default branch. Replace <dev-branch> with
# your factory development branch, and delete this file once the factory is
# live on the default branch.
#
# To run a stage: edit .github/factory-test-request.json on <dev-branch> and
# push. Set "role" back to "none" afterwards.

on:
  push:
    branches: [<dev-branch>]
    paths: [".github/factory-test-request.json"]

concurrency:
  group: factory-test
  cancel-in-progress: false

jobs:
  harness:
    uses: genai-jerry/claude-software-factory/.github/workflows/factory-test.yml@v1
    secrets: inherit
    with:
      dev_branch: <dev-branch>
      factory_ref: v1
