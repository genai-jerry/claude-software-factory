name: Factory branch guard

# Caller stub. Flags commits that land on a protected branch without a PR, and
# commits that arrived by PR but not from the org's integration branch — a
# change that reached the default branch without being proved on staging
# (FACTORY.md §6a).

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  guard:
    uses: genai-jerry/claude-software-factory/.github/workflows/factory-branch-guard.yml@v1
    secrets: inherit
