name: Factory pipeline

# Caller stub. All logic lives in the factory repo; this file owns only the
# triggers and the version pin. Bump both refs together when upgrading.

on:
  issues:
    types: [opened, labeled, closed, milestoned, demilestoned]
  issue_comment:
    types: [created]
  milestone:
    types: [created, opened]
  # Profile drift (§2c). These are the paths a repo's stack facts go stale
  # from — the commands, the toolchain, the branch layout. A push that touches
  # one re-runs the Profiler, which opens a PR only where it disagrees with
  # .factory/profile.json. Nothing else in the pipeline routes on push, and the
  # router ignores pushes to any branch but the default one. Add the manifests
  # your stack actually uses; an unmatched path costs nothing but a missed check.
  push:
    paths:
      - "package.json"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "package-lock.json"
      - "yarn.lock"
      - "pyproject.toml"
      - "requirements*.txt"
      - "go.mod"
      - "Cargo.toml"
      - "pom.xml"
      - "build.gradle*"
      - "Gemfile"
      - "composer.json"
      - "Makefile"
      - "Dockerfile"
      - "docker-compose*.yml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue (or PR) number to run the role against"
        required: true
      role:
        description: "Factory role to run"
        required: true
        type: choice
        options: [scrum, intake, fasttrack, planner, architect, dispatch, implementer, reviewer, qa, release, ops, profiler]

concurrency:
  # Milestone events carry no issue number; they get their own lane so a
  # milestone created while an issue is mid-run does not queue behind it. Push
  # (profile drift) carries neither, and gets a third lane rather than sharing
  # the milestone one — a profile check must not queue behind a release.
  group: factory-${{ github.event.issue.number || inputs.issue_number || (github.event.milestone.number && format('ms{0}', github.event.milestone.number)) || 'profile' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  factory:
    uses: genai-jerry/claude-software-factory/.github/workflows/factory-pipeline.yml@v1
    secrets: inherit
    with:
      role: ${{ inputs.role }}
      issue_number: ${{ inputs.issue_number }}
      factory_ref: v1
      # Bot actors allowed to start a role. The default (`claude`) lets the
      # factory act on issues it filed itself on a human's behalf. Set it only
      # if your factory runs under a differently-named GitHub App; `*` allows
      # every bot and is unsafe on a public repo.
      # allowed_bots: claude
