version: 2
updates:
  # Reusable workflows are pinned by every consuming repo, so their action
  # versions matter beyond this repository.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /orchestrator
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /orchestrator
    schedule:
      interval: monthly
    # The image's Python is the one CI tests on (conformance.yml pins 3.11).
    # A minor bump is a runtime change, not a patch: it needs the CI matrix
    # moved with it, and new releases lag on binary wheels (3.15 broke the
    # image build on zstandard). Move both together, by hand.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
