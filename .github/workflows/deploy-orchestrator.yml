name: Deploy Factory Orchestrator

# Deploys the LangGraph orchestrator to the Hostinger VPS the same way
# Factory Console deploys: build the image on the runner, scp the tarball,
# docker load, compose up in ~/factory-orchestrator. Traefik on
# lighthouse-network routes Host(ORCHESTRATOR_HOST) to :8080.
#
# GitHub Environment "production" (optional "staging" for a dry-run of secrets)
#   Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY  — same SSH trio as Console
#            FACTORY_GH_APP_ID, FACTORY_GH_APP_PRIVATE_KEY_B64
#              (base64 -i key.pem; GitHub forbids secret names starting GITHUB_)
#            FACTORY_GH_WEBHOOK_SECRET
#            DISPATCH_TOKEN  — must match Console ORCHESTRATOR_DISPATCH_TOKEN
#            ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN
#              (or omit if Console forwards the token on /events)
#            FACTORY_CROSS_REPO_TOKEN (optional)
#   Variables: PUBLIC_BASE_URL  — https://factory.genaipeople.com (DNS A → VPS)
#              CLAIMED_REPOS, FACTORY_REPO, FACTORY_REF

on:
  push:
    branches:
      - main
    paths:
      - "orchestrator/**"
      - ".github/workflows/deploy-orchestrator.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-orchestrator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: >-
      ${{
        github.event_name == 'workflow_dispatch' && inputs.environment || 'production'
      }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve deployment metadata
        run: |
          TARGET_ENV="${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}"
          echo "TARGET_ENV=${TARGET_ENV}" >> "$GITHUB_ENV"
          echo "DOCKER_IMAGE=factory-orchestrator" >> "$GITHUB_ENV"
          echo "IMAGE_TAR=factory-orchestrator.tar.gz" >> "$GITHUB_ENV"
        shell: bash

      - name: Validate required configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          GH_APP_ID: ${{ secrets.FACTORY_GH_APP_ID }}
          GH_APP_PRIVATE_KEY_B64: ${{ secrets.FACTORY_GH_APP_PRIVATE_KEY_B64 }}
          GH_WEBHOOK_SECRET: ${{ secrets.FACTORY_GH_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          REQUIRED=(DEPLOY_HOST DEPLOY_USER DEPLOY_KEY GH_APP_ID GH_APP_PRIVATE_KEY_B64 GH_WEBHOOK_SECRET DISPATCH_TOKEN PUBLIC_BASE_URL)
          missing=()
          for var in "${REQUIRED[@]}"; do
            if [[ -z "${!var:-}" ]]; then
              missing+=("${var/GH_/FACTORY_GH_}")
            fi
          done
          if [[ -z "${ANTHROPIC_API_KEY}" && -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]]; then
            echo "No Anthropic credential in deploy secrets — Console must send one on /events or /dispatch."
          fi
          if (( ${#missing[@]} )); then
            echo "Missing required configuration for ${TARGET_ENV}: ${missing[*]}" >&2
            echo "Configure under repo Settings -> Environments -> ${TARGET_ENV}." >&2
            exit 1
          fi
        shell: bash

      - name: Hostname for Traefik
        id: host
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          host="${PUBLIC_BASE_URL#http://}"
          host="${host#https://}"
          host="${host%%/*}"
          host="${host%%:*}"
          if [ -z "$host" ]; then
            echo "::error::PUBLIC_BASE_URL must include a hostname, e.g. https://factory.genaipeople.com"
            exit 1
          fi
          echo "orchestrator_host=$host" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t "${DOCKER_IMAGE}:latest" orchestrator/

      - name: Save Docker image
        run: docker save "${DOCKER_IMAGE}:latest" | gzip > "${IMAGE_TAR}"

      - name: Stage compose file
        run: cp orchestrator/infra/docker-compose.deploy.yml docker-compose.yml

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            mkdir -p "$HOME/factory-orchestrator"

      - name: Transfer image to deploy host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          source: ${{ env.IMAGE_TAR }}
          target: "/tmp/"

      - name: Transfer compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "docker-compose.yml"
          target: "~/factory-orchestrator/"

      - name: Deploy on host
        uses: appleboy/ssh-action@v1.0.3
        env:
          ORCHESTRATOR_HOST: ${{ steps.host.outputs.orchestrator_host }}
          GH_APP_ID: ${{ secrets.FACTORY_GH_APP_ID }}
          GH_APP_PRIVATE_KEY_B64: ${{ secrets.FACTORY_GH_APP_PRIVATE_KEY_B64 }}
          GH_WEBHOOK_SECRET: ${{ secrets.FACTORY_GH_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          FACTORY_CROSS_REPO_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          CLAIMED_REPOS: ${{ vars.CLAIMED_REPOS }}
          FACTORY_REPO_VAR: ${{ vars.FACTORY_REPO }}
          FACTORY_REF_VAR: ${{ vars.FACTORY_REF }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          timeout: 60s
          command_timeout: 30m
          envs: ORCHESTRATOR_HOST,GH_APP_ID,GH_APP_PRIVATE_KEY_B64,GH_WEBHOOK_SECRET,ANTHROPIC_API_KEY,CLAUDE_CODE_OAUTH_TOKEN,DISPATCH_TOKEN,FACTORY_CROSS_REPO_TOKEN,PUBLIC_BASE_URL,CLAIMED_REPOS,FACTORY_REPO_VAR,FACTORY_REF_VAR,IMAGE_TAR
          script: |
            set -euo pipefail

            if [ -z "${ORCHESTRATOR_HOST:-}" ]; then
              echo "ORCHESTRATOR_HOST is empty — set PUBLIC_BASE_URL on the GitHub Environment." >&2
              exit 1
            fi

            DEPLOY_DIR="$HOME/factory-orchestrator"
            cd "$DEPLOY_DIR"

            if docker compose version >/dev/null 2>&1; then
              DC=(docker compose)
            else
              DC=(docker-compose)
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo usermod -aG docker "$USER"
            fi

            docker load < "/tmp/${IMAGE_TAR:-factory-orchestrator.tar.gz}"
            rm -f "/tmp/${IMAGE_TAR:-factory-orchestrator.tar.gz}"

            GITHUB_APP_ID="${GH_APP_ID}"
            GITHUB_APP_PRIVATE_KEY_B64="${GH_APP_PRIVATE_KEY_B64}"
            GITHUB_WEBHOOK_SECRET="${GH_WEBHOOK_SECRET}"
            FACTORY_REPO="${FACTORY_REPO_VAR:-genai-jerry/claude-software-factory}"
            FACTORY_REF="${FACTORY_REF_VAR:-v1}"
            DATABASE_URL="sqlite:////data/factory-orchestrator.db"

            touch .env
            chmod 600 .env
            for KEY in ORCHESTRATOR_HOST PUBLIC_BASE_URL GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY_B64 \
                       GITHUB_WEBHOOK_SECRET DISPATCH_TOKEN ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN \
                       FACTORY_CROSS_REPO_TOKEN CLAIMED_REPOS FACTORY_REPO FACTORY_REF DATABASE_URL; do
              VALUE="${!KEY-}"
              [ -z "$VALUE" ] && continue
              TMP="$(mktemp)"
              grep -v "^${KEY}=" .env > "$TMP" || true
              printf '%s=%s\n' "$KEY" "$VALUE" >> "$TMP"
              mv "$TMP" .env
            done
            chmod 600 .env

            docker network inspect lighthouse-network >/dev/null 2>&1 || \
              docker network create lighthouse-network

            "${DC[@]}" up -d --remove-orphans

            echo "Waiting for orchestrator to become healthy..."
            for attempt in $(seq 1 60); do
              STATE=$(docker inspect -f '{{.State.Health.Status}}' factory-orchestrator 2>/dev/null || echo missing)
              if [ "$STATE" = "healthy" ]; then
                echo "orchestrator healthy"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "orchestrator did not become healthy (last state: $STATE)" >&2
                "${DC[@]}" ps
                "${DC[@]}" logs --tail 100 orchestrator
                exit 1
              fi
              sleep 3
            done

            docker image prune -f >/dev/null || true
            echo "Deployment completed. Orchestrator at https://${ORCHESTRATOR_HOST}/healthz"
            echo "Console api/worker should use ORCHESTRATOR_URL=http://factory-orchestrator:8080"
