name: Factory pipeline (reusable)

# Reusable core of the Software Factory (FACTORY.md). Consuming repos keep a
# ~15-line caller stub that owns the triggers and calls this workflow; see
# templates/workflows/factory-pipeline.yml.
#
# Because this is called with `secrets: inherit`, `github.*` and
# `context.payload` refer to the CALLER's repository and event throughout — the
# checkout below is the caller's repo, and .github/factory-{models,approvers,release}.json
# are read from it. Role definitions come from this repo, cloned at `factory_ref`
# into RUNNER_TEMP (never the workspace, so an agent's `git add` cannot sweep
# them into a PR) and injected into the prompt directly.
#
# Behaviour:
# - Release gating (.github/factory-release.json, FACTORY.md §2d). With
#   `"gating": "milestone"` a newly opened issue is parked in factory:backlog
#   until the GitHub milestone it belongs to is approved at gate G0; the
#   Scrum Master plans the release and the whole milestone enters intake as one
#   batch. With gating off (the default when the file is absent) a newly opened
#   issue goes straight to intake, as before.
# - Human gate approvals (label flips) trigger the next stages:
#     factory:release-approved -> the milestone's backlog issues enter intake
#     factory:spec-approved    -> planner (then architect, chained in-run)
#     factory:design-approved  -> dispatch (marks unblocked tasks factory:ready)
#   (factory:planned is unmapped on purpose - architect re-runs go through
#    workflow_dispatch; see route job comment.)
# - A human reply on a factory:blocked issue clears the block and re-runs the
#   blocked stage (agent comments carry an <!-- factory-agent --> marker so
#   they never self-trigger).
# - A comment of exactly "Approved" from the owner/a collaborator on an issue
#   in factory:spec-ready or factory:design-ready merges that gate's document
#   PR(s) in that repo, flips the label, and continues the next stage in-run.
#   On a release tracker in factory:release-ready it opens gate G0.
#   G3 (production) is deliberately NOT comment-approvable.
# - Closing a task sub-issue re-dispatches its epic, so tasks the merge just
#   unblocked get factory:ready without anyone re-running dispatch by hand.
#   Requires `closed` in the caller stub's `issues.types`.
# - The same "Approved" comment on a factory:ready TASK starts its implementer.
#   That is not a gate — implementation had no trigger of its own, so a ready
#   task sat until someone ran the workflow by hand. Authorised against the
#   `implementation` approver list.
# - Every agent run must leave a trace on its issue (state label moved or a
#   comment posted) or the job fails. claude-code-action exits 0 even when all
#   its tool calls were denied, so without that guard a role that accomplished
#   nothing is indistinguishable from one that worked.
# - A comment that plainly asked for something and routed nowhere gets an
#   explanatory reply, so it never dead-ends in a green run and silence.
# Note: labels applied BY these runs do not emit trigger events (GitHub
# anti-recursion), which is why planner->architect is chained in-run, the
# release batch is fanned out through a job matrix, and review/qa runs are
# started via workflow_dispatch for now.

on:
  workflow_call:
    inputs:
      role:
        description: "Factory role to run (workflow_dispatch passthrough; empty otherwise)"
        required: false
        type: string
        default: ""
      issue_number:
        description: "Issue/PR number (workflow_dispatch passthrough; empty otherwise)"
        required: false
        type: string
        default: ""
      factory_ref:
        description: "Tag/branch of the factory repo supplying role definitions. Keep in sync with the `uses:` ref in the caller stub."
        required: false
        type: string
        default: "v1"
      factory_repo:
        description: "owner/repo publishing the factory. Defaults to <caller owner>/claude-software-factory."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      role: ${{ steps.route.outputs.role }}
      issue: ${{ steps.route.outputs.issue }}
      # JSON array of issue numbers the chosen role runs against. Normally one
      # element; a release batch releases many at once (agent job is a matrix).
      issues: ${{ steps.route.outputs.issues }}
      # Set when this run may complete a release: the tracker issue number.
      # The release-chain job picks it up.
      release_issue: ${{ steps.route.outputs.release_issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: route
        uses: actions/github-script@v7
        env:
          DISPATCH_ROLE: ${{ inputs.role }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            let role = 'none', issue = '', issues = [], releaseIssue = '';
            const ev = context.eventName;

            // A release tracker carries factory:release (a KIND label, not a
            // pipeline state) plus one factory:release-* state.
            const RELEASE_KIND = 'factory:release';

            const loadJson = (p) => {
              try { return JSON.parse(fs.readFileSync(p, 'utf8')); }
              catch (e) { return {}; }
            };
            const approverList = (gate) => {
              const v = loadJson('.github/factory-approvers.json')[gate];
              return Array.isArray(v) ? v.filter(x => typeof x === 'string') : [];
            };
            // Release gating is opt-in: no file (or "gating":"none") keeps the
            // original behaviour where a filed issue goes straight to intake.
            const releaseCfg = loadJson('.github/factory-release.json');
            const gating = (releaseCfg.gating || 'none') === 'milestone';
            const exemptLabels = Array.isArray(releaseCfg.exempt_labels)
              ? releaseCfg.exempt_labels : ['factory:fast-track'];
            const autoTracker = releaseCfg.auto_create_release_issue !== false;

            const namesOf = (ls) => (ls || []).map(l => (typeof l === 'string' ? l : l.name));
            const isTaskTitle = (t) => /^task\(\d+\)/.test(t || '');
            const say = (n, body) => github.rest.issues.createComment({
              owner, repo, issue_number: n, body: `${body}\n\n<!-- factory-agent -->`,
            });
            const addLabels = (n, labels) => github.rest.issues.addLabels({
              owner, repo, issue_number: n, labels,
            });
            const dropLabel = (n, name) => github.rest.issues.removeLabel({
              owner, repo, issue_number: n, name,
            }).catch(() => {});
            // "Not started" = carries nothing but backlog/intake (blocked is
            // orthogonal). Only these are safe to park or to release in batch;
            // anything further along is in flight and must be left alone.
            const notStarted = (ls) => ls.filter(n => n.startsWith('factory:'))
              .every(n => ['factory:backlog', 'factory:intake', 'factory:blocked'].includes(n));

            // Release trackers are found by label + title, never by search:
            // the search index lags behind issue creation by seconds to minutes.
            const trackerFor = async (ms) => {
              const found = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, labels: RELEASE_KIND, state: 'all', per_page: 100,
              });
              const re = new RegExp(`^release\\(${ms}\\):`);
              return found.find(x => !x.pull_request && re.test(x.title || '')) || null;
            };
            const ensureTracker = async (milestone) => {
              const existing = await trackerFor(milestone.number);
              if (existing) return existing;
              if (!autoTracker) return null;
              // The tracker is bot-opened, so GitHub subscribes nobody to it.
              // Without an explicit cc the one state that needs a human — a
              // release nobody has planned yet — is also the one state nobody
              // is notified about, and the milestone silently stalls.
              const cc = approverList('release_scope').map(u => '@' + u).join(', ');
              const { data } = await github.rest.issues.create({
                owner, repo,
                title: `release(${milestone.number}): ${milestone.title}`,
                milestone: milestone.number,
                labels: [RELEASE_KIND, 'factory:release-planning'],
                body: [
                  `Release tracker for milestone [${milestone.title}](${milestone.html_url}).`,
                  '',
                  '**Nothing is running yet — this release is waiting on a human.**',
                  'Requirement issues filed against this milestone wait in `factory:backlog`',
                  'and no factory agent touches them until gate G0 is approved here.',
                  '',
                  'To start it:',
                  '',
                  '1. Comment `Plan release` here to run the **Scrum Master**: it reads every',
                  '   issue in the milestone and posts a release plan — scope, sequencing,',
                  '   risks and open questions — then moves this tracker to',
                  '   `factory:release-ready`.',
                  '2. When the plan looks right, an approver comments the single word',
                  '   `Approved` here (gate G0). Every backlog issue in the milestone then',
                  '   enters intake as one batch.',
                  '',
                  ...(cc ? [`cc ${cc} — this release cannot start without one of you.`, ''] : []),
                  'Managed by the Software Factory — see FACTORY.md §2d.',
                  '',
                  '<!-- factory-agent -->',
                ].join('\n'),
              });
              core.info(`Created release tracker #${data.number} for milestone ${milestone.number}`);
              return data;
            };

            // A parked issue must always be able to answer "what is this
            // waiting on?". Filing an issue and creating its milestone later is
            // the normal order, and in that order the `milestoned` event landed
            // on an issue already in factory:backlog and did nothing at all —
            // leaving the parking comment ("add this issue to a milestone") as
            // the only guidance on an issue that now has one. Point at the
            // tracker instead, once per tracker so re-milestoning cannot spam.
            const queuedMarker = (t) => `<!-- factory-queued:${t} -->`;
            const queuedNotice = async (n, ms, tracker) => {
              if (!tracker || !ms) return;
              if (namesOf(tracker.labels).includes('factory:release-approved')) return;
              const said = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: n, per_page: 100,
              }).catch(() => []);
              if (said.some(c => (c.body || '').includes(queuedMarker(tracker.number)))) return;
              await say(n, [
                `Queued for release **${ms.title}** — tracked in #${tracker.number}.`,
                '',
                'Nothing runs on this issue yet, and nothing will until that release is',
                'approved at **gate G0**. To move it along, on #' + tracker.number + ':',
                '',
                '1. comment `Plan release` to get the release plan, then',
                '2. comment `Approved` to release every issue in the milestone into intake.',
                '',
                queuedMarker(tracker.number),
              ].join('\n'));
            };

            if (ev === 'workflow_dispatch') {
              role = process.env.DISPATCH_ROLE || 'none';
              issue = process.env.DISPATCH_ISSUE || '';
              if (role === 'scrum') releaseIssue = issue;
            } else if (ev === 'milestone') {
              // A new milestone is a new release. Give it a tracker issue right
              // away so there is somewhere to plan it and somewhere to approve
              // it; the milestone itself carries no state GitHub lets us label.
              const ms = context.payload.milestone;
              if (!gating) {
                core.info('Release gating is off (.github/factory-release.json) - ignoring milestone event');
              } else if (context.payload.action === 'created' || context.payload.action === 'opened') {
                const tracker = await ensureTracker(ms);
                if (tracker) issue = String(tracker.number);
              } else {
                core.info(`Milestone ${context.payload.action} - nothing to route`);
              }
            } else if (ev === 'issue_comment') {
              const i = context.payload.issue;
              issue = String(i.number);
              const body = context.payload.comment.body || '';
              const author = context.payload.comment.user || {};
              const sender = author.login;
              const labels = namesOf(i.labels);
              const isApproval = /^\s*approved\s*[.!]?\s*$/i.test(body);
              const isPlanRelease = /^\s*plan\s+release\s*[.!]?\s*$/i.test(body);
              const isTracker = labels.includes(RELEASE_KIND);
              const assocOk = ['OWNER', 'MEMBER', 'COLLABORATOR']
                .includes(context.payload.comment.author_association);
              const authorized = (gate) => {
                const list = approverList(gate);
                return list.length ? list.includes(sender) : assocOk;
              };
              const refuse = (gate, what) => {
                const list = approverList(gate);
                return say(i.number, `@${sender} — ${what} requires ` +
                  (list.length
                    ? `approval from: ${list.map(u => '@' + u).join(', ')} (see .github/factory-approvers.json).`
                    : 'owner, member or collaborator access on this repository.'));
              };
              const stateOf = (ls) => ls.filter(n => n.startsWith('factory:') && n !== 'factory:blocked' && n !== RELEASE_KIND)
                                        .join(', ') || 'no factory:* state label';
              if (i.pull_request) {
                core.info('PR comment - skipping');
              } else if (author.type === 'Bot') {
                core.info('Bot comment - skipping');
              } else if (body.includes('<!-- factory-agent -->')) {
                core.info('Factory agent comment (marker present) - skipping');
              } else if (isTracker && isPlanRelease) {
                // Planning is not a gate — it only produces the release plan.
                // It is authorised anyway so a drive-by comment cannot spend
                // agent budget on someone else's milestone.
                if (!authorized('release_scope')) {
                  await refuse('release_scope', 'planning a release');
                } else {
                  role = 'scrum';
                  releaseIssue = issue;
                  core.info('Release planning requested - starting the Scrum Master');
                }
              } else if (isTracker && isApproval) {
                // Gate G0 — release scope. Unlike G1/G2 there is no document PR
                // to merge; approving flips the label and the release-chain job
                // releases every backlog issue in the milestone.
                if (!labels.includes('factory:release-ready')) {
                  await say(i.number,
                    `"Approved" has no effect while this release is at **${stateOf(labels)}**.\n\n` +
                    'Comment `Plan release` first — the Scrum Master reads the milestone, posts the ' +
                    'release plan and moves this tracker to `factory:release-ready`, which is gate G0.');
                } else if (!authorized('release_scope')) {
                  await refuse('release_scope', 'gate G0 (release approval)');
                } else {
                  await dropLabel(i.number, 'factory:release-ready');
                  await addLabels(i.number, ['factory:release-approved']);
                  releaseIssue = issue;
                  core.info('Gate G0 approved via comment - releasing the milestone');
                }
              } else if (isApproval && labels.includes('factory:ready')) {
                // Implementation start is NOT a gate (the gates are G0 release,
                // G1 spec, G2 design, G3 production). It needed Run workflow only
                // because labels applied by factory runs emit no trigger events, so
                // nothing picked a ready task up. Accept `Approved` as the equivalent
                // of Run workflow (role: implementer) so a task can be started from its
                // own thread. Unlike the gates there is no PR to merge, and the
                // implementer flips factory:ready -> factory:in-review itself, so the
                // router only chooses the role.
                if (!authorized('implementation')) {
                  await refuse('implementation', 'starting implementation');
                } else {
                  role = 'implementer';
                  core.info('Implementation approved via comment - starting implementer');
                }
              } else if (isApproval &&
                         (labels.includes('factory:spec-ready') || labels.includes('factory:design-ready'))) {
                // Comment-approved gate (G1/G2, document PRs only — G3 stays a human merge click).
                const spec = labels.includes('factory:spec-ready');
                const gateKey = spec ? 'spec' : 'design';
                if (!authorized(gateKey)) {
                  await refuse(gateKey, `this gate (${spec ? 'G1 spec' : 'G2 design'} approval)`);
                  core.setOutput('role', 'none'); core.setOutput('issue', issue);
                  core.setOutput('issues', '[]'); core.setOutput('release_issue', '');
                  return;
                }
                const headBranch = spec ? `factory/${i.number}-spec` : `factory/${i.number}-design`;
                const { data: prs } = await github.rest.pulls.list({
                  owner, repo, state: 'open', head: `${owner}:${headBranch}`,
                });
                let allMerged = true;
                for (const pr of prs) {
                  try {
                    await github.rest.pulls.merge({
                      owner, repo, pull_number: pr.number, merge_method: 'squash',
                    });
                    core.info(`Merged gate PR #${pr.number}`);
                  } catch (e) {
                    allMerged = false;
                    await say(i.number,
                      `Approval noted, but PR #${pr.number} could not be merged automatically (${e.message}). ` +
                      'Please merge it manually and apply the next label.');
                  }
                }
                if (prs.length === 0) core.info(`No open gate PR on ${headBranch} (already merged manually?) - proceeding`);
                if (allMerged) {
                  await dropLabel(i.number, spec ? 'factory:spec-ready' : 'factory:design-ready');
                  await addLabels(i.number, [spec ? 'factory:spec-approved' : 'factory:design-approved']);
                  // Label flips by this token emit no events - continue the next stage in-run.
                  role = spec ? 'planner' : 'dispatch';
                  core.info(`Gate approved via comment - continuing with ${role}`);
                }
              } else if (!labels.includes('factory:blocked')) {
                // Say so when someone plainly asked for something to happen. A green
                // run that does nothing looks identical to a run that worked, so an
                // unanswered "Approved" would otherwise just sit there.
                if (isApproval) {
                  await say(i.number,
                    `"Approved" has no effect while this is at **${stateOf(labels)}** — nothing was started.\n\n` +
                    'It advances the pipeline from:\n' +
                    '- `factory:release-ready` (a release tracker) — approves gate G0 and releases the whole milestone\n' +
                    '- `factory:spec-ready` — approves gate G1 and starts the planner\n' +
                    '- `factory:design-ready` — approves gate G2 and starts the dispatcher\n' +
                    '- `factory:ready` (a task sub-issue) — starts its implementer\n\n' +
                    (labels.includes('factory:backlog')
                      ? 'This issue is in the backlog: add it to a release milestone, then approve that ' +
                        'release\'s tracker issue.\n\n'
                      : '') +
                    'From any other state, use Actions → "Factory pipeline" → Run workflow with the role you want. ' +
                    'Gate G3 (production) is deliberately not comment-approvable.');
                }
                core.info('Issue not factory:blocked - comments only resume blocked stages or approve gates');
              } else {
                // resume the stage the issue was blocked in, inferred from its state label
                const resume = {
                  'factory:release-planning': 'scrum',
                  'factory:intake': 'intake',
                  'factory:spec-approved': 'planner',
                  'factory:planned': 'architect',
                  'factory:design-approved': 'dispatch',
                };
                for (const [l, r] of Object.entries(resume)) {
                  if (labels.includes(l)) { role = r; break; }
                }
                if (role === 'none' &&
                    labels.filter(n => n.startsWith('factory:')).every(n => n === 'factory:blocked')) {
                  role = isTracker ? 'scrum' : 'intake';
                }
                if (role !== 'none') {
                  core.info(`Human reply on blocked issue - resuming ${role}`);
                  if (role === 'scrum') releaseIssue = issue;
                  await dropLabel(i.number, 'factory:blocked');
                } else {
                  await say(i.number,
                    `This issue is \`factory:blocked\` at **${stateOf(labels)}**, which has no automatic resume ` +
                    'step — your reply did not restart anything. Use Actions → "Factory pipeline" → Run workflow ' +
                    'with the role you want and this issue number.');
                  core.info('Blocked at a stage without an automatic resume mapping - use Run workflow');
                }
              }
            } else if (ev === 'issues') {
              const i = context.payload.issue;
              issue = String(i.number);
              const labels = namesOf(i.labels);
              const states = labels.filter(n => n.startsWith('factory:'));
              const action = context.payload.action;
              if (action === 'opened') {
                if (i.user.type === 'Bot') {
                  core.info('Bot-authored issue - skipping');
                } else if (labels.includes(RELEASE_KIND)) {
                  core.info('Release tracker issue - skipping');
                } else if (isTaskTitle(i.title)) {
                  core.info('Factory task sub-issue - skipping');
                } else if (states.some(n => n !== 'factory:intake')) {
                  core.info('Issue already carries a factory state - skipping');
                } else {
                  // Release gating: a requirement is filed against a release, not
                  // straight into the machine. Park it until its milestone is
                  // approved at gate G0 (FACTORY.md §2d).
                  let parked = false;
                  if (gating && !labels.some(n => exemptLabels.includes(n))) {
                    const ms = i.milestone;
                    const tracker = ms ? await ensureTracker(ms) : null;
                    const approved = tracker &&
                      namesOf(tracker.labels).includes('factory:release-approved');
                    if (!approved) {
                      parked = true;
                      await dropLabel(i.number, 'factory:intake');
                      await addLabels(i.number, ['factory:backlog']);
                      if (tracker) {
                        await queuedNotice(i.number, ms, tracker);
                      } else {
                        await say(i.number, ms
                          ? `Queued for release **${ms.title}** — that milestone has no release tracker ` +
                            '(`auto_create_release_issue` is off), so nothing can approve it yet.\n\n' +
                            'Open a `release(<milestone>)` tracker issue for it, or approve gate G0 by hand.'
                          : 'Parked in `factory:backlog` — this repo runs **release-gated intake**.\n\n' +
                            'Add this issue to a milestone (the milestone *is* the release). The factory ' +
                            'opens a release tracker for it; comment `Plan release` there to get a release ' +
                            'plan, and approve it to start every issue in the release at once.\n\n' +
                            `A small fix does not need a release slot: \`${exemptLabels[0] || 'factory:fast-track'}\` ` +
                            'keeps an issue out of this queue and on the normal PR flow.');
                      }
                      core.info('Release gating on - parked in factory:backlog');
                    } else {
                      core.info(`Milestone ${ms.number} is already released - entering intake now`);
                    }
                  }
                  if (!parked) {
                    if (!labels.includes('factory:intake')) {
                      await addLabels(i.number, ['factory:intake']);
                      core.info('Applied factory:intake');
                    }
                    role = 'intake';
                  }
                }
              } else if (action === 'milestoned' || action === 'demilestoned') {
                // Moving an issue in or out of a release is the only way a
                // backlog issue changes hands, so both directions are handled.
                const ms = context.payload.milestone;
                if (!gating) {
                  core.info('Release gating is off - milestone changes are informational only');
                } else if (i.user.type === 'Bot' || labels.includes(RELEASE_KIND) || isTaskTitle(i.title)) {
                  core.info('Release tracker or factory sub-issue - skipping');
                } else if (labels.some(n => exemptLabels.includes(n))) {
                  core.info('Issue is exempt from release gating - skipping');
                } else if (!notStarted(labels)) {
                  core.info(`Issue is already in flight (${states.join(', ')}) - milestone change does not move it`);
                } else if (action === 'milestoned') {
                  const tracker = ms ? await ensureTracker(ms) : null;
                  const approved = tracker && namesOf(tracker.labels).includes('factory:release-approved');
                  if (approved) {
                    await dropLabel(i.number, 'factory:backlog');
                    if (!labels.includes('factory:intake')) await addLabels(i.number, ['factory:intake']);
                    role = 'intake';
                    await say(i.number, `Added to **${ms.title}**, which is already approved (${tracker ? '#' + tracker.number : ''}) — entering intake now.`);
                  } else if (!labels.includes('factory:backlog')) {
                    await dropLabel(i.number, 'factory:intake');
                    await addLabels(i.number, ['factory:backlog']);
                    await queuedNotice(i.number, ms, tracker);
                    core.info(`Queued in milestone ${ms.number} - waiting for gate G0`);
                  } else {
                    // Already parked, but this is the first time it has a
                    // release: say which one, and what has to happen next.
                    await queuedNotice(i.number, ms, tracker);
                    core.info(`Queued in milestone ${ms.number} - already in factory:backlog`);
                  }
                } else if (!labels.includes('factory:backlog')) {
                  await dropLabel(i.number, 'factory:intake');
                  await addLabels(i.number, ['factory:backlog']);
                  await say(i.number, `Removed from **${ms ? ms.title : 'its milestone'}** — parked in \`factory:backlog\` until it is part of an approved release.`);
                }
              } else if (action === 'closed') {
                // A task closing is what unblocks its dependents, and nothing else
                // observes that: the dispatcher only ran when the epic reached
                // factory:design-approved, so tasks freed by a later merge were
                // never released and sat with no factory:* label at all.
                // Re-dispatch the parent epic; the dispatcher is a no-op for tasks
                // whose dependencies are still open, and skips any task that
                // already carries a state label.
                const m = /^task\((\d+)\)/.exec(i.title || '');
                if (!m) {
                  core.info('Not a factory task sub-issue - nothing to re-dispatch');
                } else {
                  const epic = m[1];
                  // Only while the epic is in its implementation phase. Once it has
                  // moved on (or never got through G2) a re-dispatch is meaningless.
                  const { data: parent } = await github.rest.issues.get({
                    owner, repo, issue_number: Number(epic),
                  }).catch(() => ({ data: null })) || {};
                  const parentLabels = parent ? namesOf(parent.labels) : [];
                  if (!parentLabels.includes('factory:design-approved')) {
                    core.info(`Epic #${epic} is not factory:design-approved - not re-dispatching`);
                  } else {
                    role = 'dispatch';
                    issue = epic;
                    core.info(`Task #${i.number} closed - re-dispatching epic #${epic} to release dependents`);
                  }
                }
              } else if (action === 'labeled') {
                // factory:planned is intentionally NOT mapped: the architect is
                // chained in-run after the planner (mapping it would double-run
                // the architect when PAT label flips emit events).
                const name = context.payload.label.name;
                const sender = context.payload.sender.login;
                const gateOf = {
                  'factory:release-approved': 'release_scope',
                  'factory:spec-approved': 'spec',
                  'factory:design-approved': 'design',
                };
                const map = { 'factory:spec-approved': 'planner', 'factory:design-approved': 'dispatch' };
                if (gateOf[name]) {
                  const list = approverList(gateOf[name]);
                  if (list.length && !list.includes(sender)) {
                    // Unauthorized gate flip: revert and explain.
                    await dropLabel(i.number, name);
                    await say(i.number,
                      `\`${name}\` was applied by @${sender}, but this gate requires ` +
                      `${list.map(u => '@' + u).join(', ')} (see .github/factory-approvers.json). Reverted.`);
                  } else if (name === 'factory:release-approved') {
                    // Gate G0 flipped by hand (or by the Scrum Master in
                    // "approval": "agent" mode, when a PAT makes label flips
                    // emit events). release-chain does the batch release and
                    // is idempotent, so a duplicate event is harmless.
                    await dropLabel(i.number, 'factory:release-ready');
                    releaseIssue = issue;
                  } else {
                    role = map[name];
                  }
                }
                // Hand-off labels: notify the responsible approvers (assign + mention).
                const notifyOf = { 'factory:release-ready': ['release_scope', 'Gate G0 (release approval)'],
                                   'factory:spec-ready': ['spec', 'Gate G1 (spec approval)'],
                                   'factory:design-ready': ['design', 'Gate G2 (design approval)'],
                                   'factory:ready': ['implementation', 'Implementation start'] };
                if (notifyOf[name]) {
                  const [gate, what] = notifyOf[name];
                  const list = approverList(gate);
                  if (list.length) {
                    await github.rest.issues.addAssignees({
                      owner, repo, issue_number: i.number, assignees: list,
                    }).catch(() => {});
                    const how = gate === 'implementation'
                      ? 'Comment exactly "Approved" here to start it, or use Actions → "Factory pipeline" → Run workflow (role: implementer, this issue number).'
                      : gate === 'release_scope'
                        ? 'Read the release plan above, then comment exactly "Approved" here to release every issue in this milestone into intake.'
                        : 'Review the linked PR, then merge it + apply the approved label, or comment exactly "Approved" here.';
                    await say(i.number, `${list.map(u => '@' + u).join(' ')} — **${what}** is waiting on you. ${how}`);
                  }
                }
              }
            }
            // A matrix with no values is a workflow error, so never claim a role
            // without at least one issue to run it against.
            if (role !== 'none' && !issues.length && issue) issues = [issue];
            if (role !== 'none' && !issues.length) {
              core.info(`Role ${role} has no issue to run against - dropping it`);
              role = 'none';
            }
            core.setOutput('role', role);
            core.setOutput('issue', issue);
            core.setOutput('issues', JSON.stringify(issues.map(String)));
            core.setOutput('release_issue', releaseIssue);
            core.info(`route: role=${role} issue=${issue} issues=${JSON.stringify(issues)} release_issue=${releaseIssue || '-'}`);

  agent:
    needs: route
    if: needs.route.outputs.role != 'none' && needs.route.outputs.role != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Usually a single issue. A release batch runs the same role over every
      # issue the milestone released; one failure must not cancel the rest.
      fail-fast: false
      max-parallel: 4
      matrix:
        issue: ${{ fromJSON(needs.route.outputs.issues) }}
    steps:
      - name: Require Anthropic credentials
        env:
          HAS_CREDS: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_CREDS" != "true" ]; then
            echo "::error::Add ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) to this repo's Actions secrets (Settings -> Secrets and variables -> Actions) to run factory agents."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load factory role definition
        id: roledef
        env:
          FACTORY_REPO: ${{ inputs.factory_repo || format('{0}/claude-software-factory', github.repository_owner) }}
          FACTORY_REF: ${{ inputs.factory_ref }}
          ROLE: ${{ needs.route.outputs.role }}
        run: |
          # Cloned outside the workspace on purpose: an agent running `git add -A`
          # in the repo must not be able to sweep the factory into its PR.
          git clone --depth 1 --branch "$FACTORY_REF" \
            "https://github.com/$FACTORY_REPO" "$RUNNER_TEMP/factory"
          ROLE_FILE="$RUNNER_TEMP/factory/commands/$ROLE.md"
          if [ ! -f "$ROLE_FILE" ]; then
            echo "::error::No role definition '$ROLE' in $FACTORY_REPO@$FACTORY_REF"
            exit 1
          fi
          {
            echo 'text<<FACTORY_DEF_EOF'
            cat "$RUNNER_TEMP/factory/FACTORY.md"
            printf '\n\n===== ROLE INSTRUCTIONS (%s) =====\n\n' "$ROLE"
            cat "$ROLE_FILE"
            echo 'FACTORY_DEF_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Snapshot issue state (no-op guard)
        id: before
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          ISSUE: ${{ matrix.issue }}
        run: |
          # Paired with "Verify the role changed something" below. A role that
          # neither moves the state label nor says anything has done nothing,
          # and must not report success.
          if [ -z "$ISSUE" ]; then
            echo "No issue number for this run - skipping the no-op guard."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SNAP=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" \
                   --jq '"\(.comments)|\([.labels[].name | select(startswith("factory:"))] | sort | join(","))"')
          echo "snap=$SNAP" >> "$GITHUB_OUTPUT"
          echo "Before: $SNAP"
      - name: Install Claude Code CLI (model probe)
        run: npm install -g @anthropic-ai/claude-code
      - name: Resolve model (first accessible in preference chain)
        id: model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ROLE: ${{ needs.route.outputs.role }}
        run: |
          CHAIN=$(python3 -c "import json;m=json.load(open('.github/factory-models.json'));v=m.get('$ROLE',['claude-sonnet-5']);print(' '.join(v if isinstance(v,list) else [v]))" 2>/dev/null || echo claude-sonnet-5)
          echo "Preference chain for $ROLE: $CHAIN"
          MODEL=""
          for m in $CHAIN; do
            echo "Probing model access: $m"
            if timeout 120 claude -p "Reply with exactly: OK" --model "$m" --max-turns 1 >/dev/null 2>&1; then
              MODEL="$m"; echo "Selected model: $m"; break
            fi
            echo "::warning::Model $m is not accessible with this credential - trying next in chain"
          done
          if [ -z "$MODEL" ]; then
            echo "::error::No model in the preference chain is accessible - check credentials/plan or edit .github/factory-models.json"
            exit 1
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
      - name: Run factory role
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          OPENSPEC_TELEMETRY: "0"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are running the "${{ needs.route.outputs.role }}" role of the
            Software Factory inside GitHub Actions, on repository
            ${{ github.repository }}.

            The factory handbook and your role instructions follow verbatim
            below. Execute the role instructions, treating number
            ${{ matrix.issue }} as the issue/PR argument
            ($ARGUMENTS).

            Repo-specific facts (stack, test/build commands, conventions) live
            in .factory/profile.json in the checked-out repository — your role
            instructions tell you when to read it.

            Operating rules:
            - Use the gh CLI for GitHub operations (labels, comments, PRs); GH_TOKEN is set.
            - HARD RULES: never push to main or master; never merge a pull request;
              perform exactly one factory role in this run.
            - End EVERY comment you post on an issue or PR with a line containing
              exactly: <!-- factory-agent -->
              (it stops your own comments from re-triggering the pipeline).

            Cross-repo epics: if the change folder lists other repos in this
            estate and GH_TOKEN has cross-repo access (FACTORY_CROSS_REPO_TOKEN
            secret), operate on them with the gh CLI —
            `gh repo clone ${{ github.repository_owner }}/<repo> /tmp/<repo>` — and
            create sub-issues, push factory branches and open PRs there as the role
            requires (never to main/master). If the role needs cross-repo access and the
            token cannot reach the other repo, comment on the epic that the
            FACTORY_CROSS_REPO_TOKEN secret is required and apply factory:blocked.

            Note on triggering: with the default workflow token, label changes you make
            do NOT emit trigger events (GitHub anti-recursion); with the
            FACTORY_CROSS_REPO_TOKEN PAT they DO. Either way: apply exactly the state
            labels your role instructions specify — never extra ones — and let the
            pipeline's own routing decide what runs next.

            ===== FACTORY HANDBOOK =====

            ${{ steps.roledef.outputs.text }}
          # Headless runs have no one to answer a permission prompt, so anything
          # not explicitly allowed here is DENIED. Without this block the role
          # reads the repo, then silently fails to run `gh`, write files or
          # commit — the run goes green and the epic sits at its current label.
          # Keep in sync with the same list in factory-test.yml.
          claude_args: |
            --max-turns 50
            --model ${{ steps.model.outputs.model }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,TodoWrite,Task,Skill"
      - name: Verify the role changed something (no-op guard)
        if: steps.before.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          ISSUE: ${{ matrix.issue }}
          ROLE: ${{ needs.route.outputs.role }}
          BEFORE: ${{ steps.before.outputs.snap }}
        run: |
          # claude-code-action exits 0 even when every tool call was denied, so a
          # role that accomplished nothing still reports success and the issue
          # sits at its label forever. Require a visible trace instead.
          #
          # The trace is "state label moved OR a comment was posted" rather than
          # "label moved": a role may legitimately decline to advance the issue
          # (intake recommending fast-track, any role applying factory:blocked)
          # but it always says so on the issue first.
          AFTER=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" \
                    --jq '"\(.comments)|\([.labels[].name | select(startswith("factory:"))] | sort | join(","))"')
          echo "Before: $BEFORE"
          echo "After:  $AFTER"
          if [ "$AFTER" != "$BEFORE" ]; then
            echo "Role '$ROLE' left a trace on #$ISSUE."
            exit 0
          fi
          DENIALS=$(jq -r '[.. | objects | select(has("permission_denials_count")) | .permission_denials_count] | last // 0' \
                      "$RUNNER_TEMP/claude-execution-output.json" 2>/dev/null || echo 0)
          [ -n "$DENIALS" ] || DENIALS=0
          HINT="Check the role's own log above for where it stopped."
          if [ "$DENIALS" -gt 0 ]; then
            HINT="$DENIALS tool permission denial(s) were recorded - the --allowedTools list in this workflow is the likely cause."
          fi
          echo "::error::Role '$ROLE' finished but changed nothing on #$ISSUE - no factory:* label change and no new comment. $HINT"
          exit 1

  release-chain:
    # Gate G0's mechanical half: once a release tracker carries
    # factory:release-approved, every backlog issue in its milestone is moved to
    # factory:intake and handed to the release-intake matrix below.
    #
    # It runs in two situations, which is why it keys on the label rather than
    # on how it got there:
    #   - a human (or the router, after an `Approved` comment) approved the
    #     release; the agent job never ran
    #   - "approval": "agent" — the Scrum Master approved its own release plan
    #     during the run that just finished
    needs: [route, agent]
    if: >-
      always() &&
      needs.route.outputs.release_issue != '' &&
      needs.agent.result != 'failure' &&
      needs.agent.result != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.release.outputs.issues }}
      count: ${{ steps.release.outputs.count }}
    steps:
      - id: release
        uses: actions/github-script@v7
        env:
          RELEASE_ISSUE: ${{ needs.route.outputs.release_issue }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const n = Number(process.env.RELEASE_ISSUE);
            const namesOf = (ls) => (ls || []).map(l => (typeof l === 'string' ? l : l.name));
            core.setOutput('issues', '[]');
            core.setOutput('count', '0');

            const { data: tracker } = await github.rest.issues.get({ owner, repo, issue_number: n });
            if (!namesOf(tracker.labels).includes('factory:release-approved')) {
              core.info(`Release #${n} is not factory:release-approved - nothing to release.`);
              return;
            }
            // Idempotence marker. Both an approval event and the in-run chain can
            // land on the same release (a PAT makes agent label flips emit
            // events); the second one must not start every intake twice.
            const MARK = '<!-- factory-release-dispatched -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: n, per_page: 100,
            });
            if (comments.some(c => (c.body || '').includes(MARK))) {
              core.info(`Release #${n} was already dispatched - skipping.`);
              return;
            }
            const m = /^release\((\d+)\):/.exec(tracker.title || '');
            if (!m) {
              core.info(`#${n} does not name a milestone in its title - skipping.`);
              return;
            }
            const members = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, milestone: m[1], state: 'open', per_page: 100,
            });
            const started = [], skipped = [];
            for (const it of members) {
              if (it.pull_request) continue;
              const ls = namesOf(it.labels);
              if (ls.includes('factory:release')) continue;          // the tracker itself
              if (/^task\(\d+\)/.test(it.title || '')) continue;      // factory sub-issues
              const inflight = ls.filter(x => x.startsWith('factory:') &&
                !['factory:backlog', 'factory:intake', 'factory:blocked'].includes(x));
              if (inflight.length) { skipped.push(`#${it.number} — already \`${inflight.join('`, `')}\``); continue; }
              if (ls.includes('factory:backlog')) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: it.number, name: 'factory:backlog',
                }).catch(() => {});
              }
              if (!ls.includes('factory:intake')) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: it.number, labels: ['factory:intake'],
                });
              }
              started.push(it.number);
            }
            const lines = [`**Gate G0 approved** — releasing milestone \`${tracker.title.replace(/^release\(\d+\):\s*/, '')}\`.`, ''];
            lines.push(started.length
              ? `${started.length} issue(s) enter intake now:\n` + started.map(x => `- #${x} → \`factory:intake\``).join('\n')
              : '_No backlog issues in this milestone — nothing to start._');
            if (skipped.length) {
              lines.push('', 'Already in flight, left where they are:', ...skipped.map(s => `- ${s}`));
            }
            lines.push('', 'Issues added to this milestone from now on enter intake immediately.', '', MARK);
            await github.rest.issues.createComment({
              owner, repo, issue_number: n, body: lines.join('\n') + '\n\n<!-- factory-agent -->',
            });
            core.setOutput('issues', JSON.stringify(started.map(String)));
            core.setOutput('count', String(started.length));
            core.info(`Released ${started.length} issue(s) from milestone ${m[1]}`);

  release-intake:
    # The release batch. Same steps as the `agent` job with the role fixed to
    # intake — a called workflow cannot re-enter itself, and labels this run
    # applies emit no events, so the fan-out has to happen in-run.
    # Keep in sync with the `agent` job above.
    needs: [route, release-chain]
    if: needs.release-chain.outputs.count != '' && needs.release-chain.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        issue: ${{ fromJSON(needs.release-chain.outputs.issues) }}
    steps:
      - name: Require Anthropic credentials
        env:
          HAS_CREDS: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_CREDS" != "true" ]; then
            echo "::error::Add ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) to this repo's Actions secrets (Settings -> Secrets and variables -> Actions) to run factory agents."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load factory role definition
        id: roledef
        env:
          FACTORY_REPO: ${{ inputs.factory_repo || format('{0}/claude-software-factory', github.repository_owner) }}
          FACTORY_REF: ${{ inputs.factory_ref }}
        run: |
          git clone --depth 1 --branch "$FACTORY_REF" \
            "https://github.com/$FACTORY_REPO" "$RUNNER_TEMP/factory"
          {
            echo 'text<<FACTORY_DEF_EOF'
            cat "$RUNNER_TEMP/factory/FACTORY.md"
            printf '\n\n===== ROLE INSTRUCTIONS (intake) =====\n\n'
            cat "$RUNNER_TEMP/factory/commands/intake.md"
            echo 'FACTORY_DEF_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Snapshot issue state (no-op guard)
        id: before
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          ISSUE: ${{ matrix.issue }}
        run: |
          SNAP=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" \
                   --jq '"\(.comments)|\([.labels[].name | select(startswith("factory:"))] | sort | join(","))"')
          echo "snap=$SNAP" >> "$GITHUB_OUTPUT"
          echo "Before: $SNAP"
      - name: Install Claude Code CLI (model probe)
        run: npm install -g @anthropic-ai/claude-code
      - name: Resolve model (first accessible in preference chain)
        id: model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ROLE: intake
        run: |
          CHAIN=$(python3 -c "import json;m=json.load(open('.github/factory-models.json'));v=m.get('$ROLE',['claude-sonnet-5']);print(' '.join(v if isinstance(v,list) else [v]))" 2>/dev/null || echo claude-sonnet-5)
          echo "Preference chain for $ROLE: $CHAIN"
          MODEL=""
          for m in $CHAIN; do
            echo "Probing model access: $m"
            if timeout 120 claude -p "Reply with exactly: OK" --model "$m" --max-turns 1 >/dev/null 2>&1; then
              MODEL="$m"; echo "Selected model: $m"; break
            fi
            echo "::warning::Model $m is not accessible with this credential - trying next in chain"
          done
          if [ -z "$MODEL" ]; then
            echo "::error::No model in the preference chain is accessible - check credentials/plan or edit .github/factory-models.json"
            exit 1
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
      - name: Run intake role
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          OPENSPEC_TELEMETRY: "0"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are running the "intake" role of the Software Factory inside
            GitHub Actions, on repository ${{ github.repository }}. This issue
            was released as part of an approved release milestone (gate G0), so
            it is one of several intakes running in parallel — stay strictly
            inside your own issue.

            The factory handbook and your role instructions follow verbatim
            below. Execute the role instructions, treating number
            ${{ matrix.issue }} as the issue argument ($ARGUMENTS).

            Repo-specific facts (stack, test/build commands, conventions) live
            in .factory/profile.json in the checked-out repository.

            Operating rules:
            - Use the gh CLI for GitHub operations (labels, comments, PRs); GH_TOKEN is set.
            - HARD RULES: never push to main or master; never merge a pull request;
              perform exactly one factory role in this run.
            - End EVERY comment you post on an issue or PR with a line containing
              exactly: <!-- factory-agent -->

            ===== FACTORY HANDBOOK =====

            ${{ steps.roledef.outputs.text }}
          claude_args: |
            --max-turns 50
            --model ${{ steps.model.outputs.model }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,TodoWrite,Task,Skill"
      - name: Verify the role changed something (no-op guard)
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          ISSUE: ${{ matrix.issue }}
          BEFORE: ${{ steps.before.outputs.snap }}
        run: |
          AFTER=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" \
                    --jq '"\(.comments)|\([.labels[].name | select(startswith("factory:"))] | sort | join(","))"')
          echo "Before: $BEFORE"
          echo "After:  $AFTER"
          if [ "$AFTER" != "$BEFORE" ]; then
            echo "Role 'intake' left a trace on #$ISSUE."
            exit 0
          fi
          DENIALS=$(jq -r '[.. | objects | select(has("permission_denials_count")) | .permission_denials_count] | last // 0' \
                      "$RUNNER_TEMP/claude-execution-output.json" 2>/dev/null || echo 0)
          [ -n "$DENIALS" ] || DENIALS=0
          HINT="Check the role's own log above for where it stopped."
          if [ "$DENIALS" -gt 0 ]; then
            HINT="$DENIALS tool permission denial(s) were recorded - the --allowedTools list in this workflow is the likely cause."
          fi
          echo "::error::Role 'intake' finished but changed nothing on #$ISSUE - no factory:* label change and no new comment. $HINT"
          exit 1

  architect-chain:
    needs: [route, agent]
    if: needs.agent.result == 'success' && needs.route.outputs.role == 'planner'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify planner advanced the epic to factory:planned
        id: gate
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/issues/${{ needs.route.outputs.issue }}" --jq '.labels[].name' | grep -qx 'factory:planned'; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Planner did not reach factory:planned (blocked or split) - not chaining architect."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          fetch-depth: 0
      - name: Load factory role definition
        if: steps.gate.outputs.proceed == 'true'
        id: roledef
        env:
          FACTORY_REPO: ${{ inputs.factory_repo || format('{0}/claude-software-factory', github.repository_owner) }}
          FACTORY_REF: ${{ inputs.factory_ref }}
        run: |
          git clone --depth 1 --branch "$FACTORY_REF" \
            "https://github.com/$FACTORY_REPO" "$RUNNER_TEMP/factory"
          {
            echo 'text<<FACTORY_DEF_EOF'
            cat "$RUNNER_TEMP/factory/FACTORY.md"
            printf '\n\n===== ROLE INSTRUCTIONS (architect) =====\n\n'
            cat "$RUNNER_TEMP/factory/commands/architect.md"
            echo 'FACTORY_DEF_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Install Claude Code CLI (model probe)
        if: steps.gate.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Resolve architect model (first accessible in preference chain)
        if: steps.gate.outputs.proceed == 'true'
        id: model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ROLE: architect
        run: |
          CHAIN=$(python3 -c "import json;m=json.load(open('.github/factory-models.json'));v=m.get('$ROLE',['claude-sonnet-5']);print(' '.join(v if isinstance(v,list) else [v]))" 2>/dev/null || echo claude-sonnet-5)
          echo "Preference chain for $ROLE: $CHAIN"
          MODEL=""
          for m in $CHAIN; do
            echo "Probing model access: $m"
            if timeout 120 claude -p "Reply with exactly: OK" --model "$m" --max-turns 1 >/dev/null 2>&1; then
              MODEL="$m"; echo "Selected model: $m"; break
            fi
            echo "::warning::Model $m is not accessible with this credential - trying next in chain"
          done
          if [ -z "$MODEL" ]; then
            echo "::error::No model in the preference chain is accessible - check credentials/plan or edit .github/factory-models.json"
            exit 1
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
      - name: Run architect role
        if: steps.gate.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          OPENSPEC_TELEMETRY: "0"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are running the "architect" role of the Software Factory inside
            GitHub Actions (chained after the planner), on repository
            ${{ github.repository }}.

            The factory handbook and your role instructions follow verbatim
            below. Execute them, treating number
            ${{ needs.route.outputs.issue }} as the epic issue argument
            ($ARGUMENTS).

            Operating rules:
            - Use the gh CLI for GitHub operations; GH_TOKEN is set.
            - HARD RULES: never push to main or master; never merge a pull request.
              End EVERY comment you post with a line containing exactly:
              <!-- factory-agent -->
            - Cross-repo epics: clone other affected repos with
              `gh repo clone ${{ github.repository_owner }}/<repo> /tmp/<repo>` (GH_TOKEN
              grants access when the FACTORY_CROSS_REPO_TOKEN secret is set) and commit
              each repo's design.md to its own change folder via a factory branch + PR.
              If cross-repo access is missing, comment on the epic and apply
              factory:blocked.

            ===== FACTORY HANDBOOK =====

            ${{ steps.roledef.outputs.text }}
          # Headless runs have no one to answer a permission prompt, so anything
          # not explicitly allowed here is DENIED. Without this block the role
          # reads the repo, then silently fails to run `gh`, write files or
          # commit — the run goes green and the epic sits at its current label.
          # Keep in sync with the same list in factory-test.yml.
          claude_args: |
            --max-turns 50
            --model ${{ steps.model.outputs.model }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,TodoWrite,Task,Skill"
