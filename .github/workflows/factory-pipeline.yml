name: Factory pipeline (reusable)

# Reusable core of the Software Factory (FACTORY.md). Consuming repos keep a
# ~15-line caller stub that owns the triggers and calls this workflow; see
# templates/workflows/factory-pipeline.yml.
#
# Because this is called from a consuming repo, `github.*` and
# `context.payload` refer to the CALLER's repository and event throughout — the
# checkout below is the caller's repo, and .github/factory-{models,approvers,release}.json
# are read from it. Role definitions come from this repo, cloned at `factory_ref`
# into RUNNER_TEMP (never the workspace, so an agent's `git add` cannot sweep
# them into a PR) and injected into the prompt directly.
#
# Caller secrets must be passed by name, not `secrets: inherit`. Inherit only
# forwards secrets when the caller and this workflow are in the same GitHub
# Organisation or Enterprise; a SaaS factory is called from other accounts, so
# inherit leaves ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN empty and the
# agent job fails at "Require Anthropic credentials".
#
# Behaviour:
# - Release gating (.github/factory-release.json, FACTORY.md §2d). With
#   `"gating": "milestone"` a newly opened issue is parked in factory:backlog
#   until the GitHub milestone it belongs to is approved at gate G0; the
#   Scrum Master plans the release and the whole milestone enters intake as one
#   batch. With gating off (the default when the file is absent) a newly opened
#   issue goes straight to intake, as before.
# - Human gate approvals (label flips) trigger the next stages:
#     factory:release-approved -> the milestone's backlog issues enter intake
#     factory:spec-approved    -> planner (then architect, chained in-run)
#     factory:design-approved  -> dispatch (marks unblocked tasks factory:ready)
#   (factory:planned is unmapped on purpose - architect re-runs go through
#    workflow_dispatch; see route job comment.)
# - A human reply on a factory:blocked issue clears the block and re-runs the
#   blocked stage (agent comments carry an <!-- factory-agent --> marker so
#   they never self-trigger).
# - A comment of exactly "Approved" from the owner/a collaborator on an issue
#   in factory:spec-ready or factory:design-ready merges that gate's document
#   PR(s) in that repo, flips the label, and continues the next stage in-run.
#   With the branch policy's epics:true the merge lands on the epic branch
#   factory/epic-<n> (FACTORY.md §6b) — the spec gate creates it and retargets
#   a default-branch-based document PR onto it (in-flight adoption).
#   On a release tracker in factory:release-ready it opens gate G0.
#   G3 (production) is deliberately NOT comment-approvable.
# - Closing a task sub-issue re-dispatches its epic, so tasks the merge just
#   unblocked get factory:ready without anyone re-running dispatch by hand.
#   Requires `closed` in the caller stub's `issues.types`.
# - The same "Approved" comment on a factory:ready TASK starts its implementer.
#   That is not a gate — implementation had no trigger of its own, so a ready
#   task sat until someone ran the workflow by hand. Authorised against the
#   `implementation` approver list.
# - While a role is actually running, its issue carries factory:in-progress.
#   A role takes minutes, and until it finished the issue looked exactly like
#   one nothing had started on; the marker makes "a GitHub Action is working on
#   this right now" visible in the issue list. It is a marker, not a state
#   (like factory:blocked): every factory:* test in the router ignores it, and
#   each agent job removes it in an always() step whatever the outcome.
# - Every agent run must leave a trace on its issue (state label moved or a
#   comment posted) or the job fails. claude-code-action exits 0 even when all
#   its tool calls were denied, so without that guard a role that accomplished
#   nothing is indistinguishable from one that worked.
# - A comment that plainly asked for something and routed nowhere gets an
#   explanatory reply, so it never dead-ends in a green run and silence.
# - Events raised by the factory's own App (`allowed_bots`, default `claude`)
#   start roles like anyone else's. The factory files issues on a human's
#   behalf — a fast-track fix split out of the issue a role was working on, a
#   release tracker — and those are human-initiated work wearing the bot's
#   name; refusing them stranded the request with a red run and no explanation.
#   Authorship is not the safety property here and never was: the router below
#   is, and it decides per event (bot-authored issues do not enter intake on
#   `opened`; agent comments carry <!-- factory-agent --> so they never
#   self-trigger; gate flips are checked against factory-approvers.json
#   whoever sends them). Widening this to `*` hands any App that can label an
#   issue a prompt-controlled agent run, which on a public repo is a hole.
# Note: labels applied BY these runs do not emit trigger events (GitHub
# anti-recursion), which is why planner->architect is chained in-run, the
# release batch is fanned out through a job matrix, and review/qa runs are
# started via workflow_dispatch for now.

on:
  workflow_call:
    inputs:
      role:
        description: "Factory role to run (workflow_dispatch passthrough; empty otherwise)"
        required: false
        type: string
        default: ""
      issue_number:
        description: "Issue/PR number (workflow_dispatch passthrough; empty otherwise)"
        required: false
        type: string
        default: ""
      factory_ref:
        description: "Tag/branch of the factory repo supplying role definitions. Keep in sync with the `uses:` ref in the caller stub."
        required: false
        type: string
        default: "v1"
      factory_repo:
        description: "owner/repo publishing the factory. Defaults to the repo on the caller stub's uses: line, resolved from the run's referenced workflows (github.workflow_ref names the CALLER, so it cannot locate the factory). Pass it explicitly to override the lookup."
        required: false
        type: string
        default: ""
      allowed_bots:
        description: "Bot actors whose events may start a role (claude-code-action `allowed_bots`). Defaults to the factory's own App; `*` allows every bot and is unsafe on a public repo."
        required: false
        type: string
        default: "claude"
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      FACTORY_CROSS_REPO_TOKEN:
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      role: ${{ steps.route.outputs.role }}
      issue: ${{ steps.route.outputs.issue }}
      # JSON array of issue numbers the chosen role runs against. Normally one
      # element; a release batch releases many at once (agent job is a matrix).
      issues: ${{ steps.route.outputs.issues }}
      # Set when this run may complete a release: the tracker issue number.
      # The release-chain job picks it up.
      release_issue: ${{ steps.route.outputs.release_issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: route
        uses: actions/github-script@v7
        env:
          DISPATCH_ROLE: ${{ inputs.role }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          # Read-and-dispatch access to the epic's repo, for a cross-repo epic
          # (FACTORY.md §7). Absent is fine: the router then says on the task
          # what to run over there instead of guessing.
          CROSS_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            let role = 'none', issue = '', issues = [], releaseIssue = '';
            const ev = context.eventName;

            // A release tracker carries factory:release (a KIND label, not a
            // pipeline state) plus one factory:release-* state.
            const RELEASE_KIND = 'factory:release';

            // The fast lane. Like factory:release this is a KIND marker rather
            // than a pipeline state: it says "this change is too small for
            // OpenSpec ceremony", and the Fast-Track role does the whole thing
            // in one run — code, tests, PR — for a human to review and merge.
            // It is matched by name, not through exempt_labels: a repo may add
            // its own exempt labels (say `hotfix`) that skip the release queue
            // without wanting an agent to start writing code.
            const FAST_TRACK = 'factory:fast-track';
            const FAST_TRACK_DONE = '<!-- factory-fast-track-done -->';

            // The repo profile (§2c). Another KIND marker: it says "this issue
            // is the home of this repo's .factory/profile.json", not a place in
            // the pipeline. Its issue is a singleton — one per repo, reused —
            // because the Profiler is maintenance, not a piece of work: every
            // draft and every drift check belongs in the same thread, where the
            // history of what the factory believes about this repo can be read
            // in one place.
            const PROFILE_KIND = 'factory:profile';
            const PROFILE_TITLE = 'Factory: repo profile';

            // "A GitHub Action is working on this issue right now." Applied by
            // the agent jobs when they start and removed when they finish, so
            // it is a marker like factory:blocked, not a pipeline state — every
            // factory:* test below ignores it. Anything else and a run would
            // change the routing of the very issue it is running on: a marked
            // issue would read as "in flight" to the fast lane, as "already
            // started" to a release batch, and as its own state in the replies.
            const IN_PROGRESS = 'factory:in-progress';
            // Labels that say nothing about where an issue is in the pipeline.
            const ORTHOGONAL = [IN_PROGRESS, 'factory:blocked'];

            const loadJson = (p) => {
              try { return JSON.parse(fs.readFileSync(p, 'utf8')); }
              catch (e) { return {}; }
            };
            // Engine stand-down (orchestration/engine-selection). When
            // .github/factory-orchestrator.json names an external engine, that
            // engine drives this repo and the Actions pipeline must not route,
            // mutate a label, or post a reply — at most one engine acts per
            // event, and both engines evaluate this same file when they
            // process one. An absent or unparseable file means
            // "github-actions", which keeps every existing repo exactly as it
            // was. This exits before any side effect below.
            const orchCfg = loadJson('.github/factory-orchestrator.json');
            const engine = typeof orchCfg.engine === 'string' && orchCfg.engine ? orchCfg.engine : 'github-actions';
            if (engine !== 'github-actions') {
              core.info(`Engine stand-down: .github/factory-orchestrator.json names "${engine}" - that engine drives this repo, so this run routes nothing. Revert the file to github-actions (or remove it) to hand the repo back to Actions.`);
              core.setOutput('role', 'none'); core.setOutput('issue', '');
              core.setOutput('issues', '[]'); core.setOutput('release_issue', '');
              return;
            }
            const approverList = (gate) => {
              const v = loadJson('.github/factory-approvers.json')[gate];
              return Array.isArray(v) ? v.filter(x => typeof x === 'string') : [];
            };
            // Release gating is opt-in: no file (or "gating":"none") keeps the
            // original behaviour where a filed issue goes straight to intake.
            const releaseCfg = loadJson('.github/factory-release.json');
            const gating = (releaseCfg.gating || 'none') === 'milestone';
            const exemptLabels = Array.isArray(releaseCfg.exempt_labels)
              ? releaseCfg.exempt_labels : ['factory:fast-track'];
            const autoTracker = releaseCfg.auto_create_release_issue !== false;

            const namesOf = (ls) => (ls || []).map(l => (typeof l === 'string' ? l : l.name));
            const isTaskTitle = (t) => /^task\(\d+\)/.test(t || '');
            // "Part of owner/repo#250" — the qualified parent marker (FACTORY.md §7).
            // The unqualified forms mean the issue's own repo.
            const epicRefFromBody = (body) => {
              const m = /(?:^|\n)\s*(?:part of|parent|epic)\s*:?\s*(?:https?:\/\/[^/\s]+\/([\w.-]+)\/([\w.-]+)\/issues\/(\d+)|([\w.-]+)\/([\w.-]+)#(\d+)|#(\d+))/i.exec(body || '');
              if (!m) return { repo: null, number: null };
              if (m[3]) return { repo: `${m[1]}/${m[2]}`, number: Number(m[3]) };
              if (m[6]) return { repo: `${m[4]}/${m[5]}`, number: Number(m[6]) };
              return { repo: null, number: Number(m[7]) };
            };
            const say = (n, body) => github.rest.issues.createComment({
              owner, repo, issue_number: n, body: `${body}\n\n<!-- factory-agent -->`,
            });
            const addLabels = (n, labels) => github.rest.issues.addLabels({
              owner, repo, issue_number: n, labels,
            });
            const dropLabel = (n, name) => github.rest.issues.removeLabel({
              owner, repo, issue_number: n, name,
            }).catch(() => {});
            // "Not started" = carries nothing but backlog/intake (blocked and
            // in-progress are orthogonal). Only these are safe to park or to
            // release in batch; anything further along is in flight and must be
            // left alone.
            const notStarted = (ls) => ls.filter(n => n.startsWith('factory:'))
              .every(n => ['factory:backlog', 'factory:intake', ...ORTHOGONAL].includes(n));
            // Human-readable "where is this issue" for the explanatory replies.
            // Kind markers, factory:blocked and factory:in-progress are
            // orthogonal to the state.
            const stateOf = (ls) => ls.filter(n => n.startsWith('factory:') &&
                                              !ORTHOGONAL.includes(n) && n !== RELEASE_KIND && n !== FAST_TRACK &&
                                              n !== PROFILE_KIND)
                                      .join(', ') || 'no factory:* state label';

            // Release trackers are found by label + title, never by search:
            // the search index lags behind issue creation by seconds to minutes.
            const trackerFor = async (ms) => {
              const found = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, labels: RELEASE_KIND, state: 'all', per_page: 100,
              });
              const re = new RegExp(`^release\\(${ms}\\):`);
              return found.find(x => !x.pull_request && re.test(x.title || '')) || null;
            };
            const ensureTracker = async (milestone) => {
              const existing = await trackerFor(milestone.number);
              if (existing) return existing;
              if (!autoTracker) return null;
              // The tracker is bot-opened, so GitHub subscribes nobody to it.
              // Without an explicit cc the one state that needs a human — a
              // release nobody has planned yet — is also the one state nobody
              // is notified about, and the milestone silently stalls.
              const cc = approverList('release_scope').map(u => '@' + u).join(', ');
              const { data } = await github.rest.issues.create({
                owner, repo,
                title: `release(${milestone.number}): ${milestone.title}`,
                milestone: milestone.number,
                labels: [RELEASE_KIND, 'factory:release-planning'],
                body: [
                  `Release tracker for milestone [${milestone.title}](${milestone.html_url}).`,
                  '',
                  '**Nothing is running yet — this release is waiting on a human.**',
                  'Requirement issues filed against this milestone wait in `factory:backlog`',
                  'and no factory agent touches them until gate G0 is approved here.',
                  '',
                  'To start it:',
                  '',
                  '1. Comment `Plan release` here to run the **Scrum Master**: it reads every',
                  '   issue in the milestone and posts a release plan — scope, sequencing,',
                  '   risks and open questions — then moves this tracker to',
                  '   `factory:release-ready`.',
                  '2. When the plan looks right, an approver comments the single word',
                  '   `Approved` here (gate G0). Every backlog issue in the milestone then',
                  '   enters intake as one batch.',
                  '',
                  ...(cc ? [`cc ${cc} — this release cannot start without one of you.`, ''] : []),
                  'Managed by the Software Factory — see FACTORY.md §2d.',
                  '',
                  '<!-- factory-agent -->',
                ].join('\n'),
              });
              core.info(`Created release tracker #${data.number} for milestone ${milestone.number}`);
              return data;
            };

            // The profile issue, found the same way and for the same reason as
            // a release tracker: by label, never by search.
            const profileIssue = async () => {
              const found = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, labels: PROFILE_KIND, state: 'all', per_page: 100,
              });
              return found.find(x => !x.pull_request) || null;
            };
            const ensureProfileIssue = async () => {
              const existing = await profileIssue();
              if (existing) {
                // Reopen rather than file a second one: this thread is where
                // the previous drafts and their evidence live.
                if (existing.state === 'closed') {
                  await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'open' })
                    .catch(() => {});
                }
                return existing;
              }
              const { data } = await github.rest.issues.create({
                owner, repo,
                title: PROFILE_TITLE,
                labels: [PROFILE_KIND],
                body: [
                  'Home of this repository\'s `.factory/profile.json` (FACTORY.md §2c) — the stack facts',
                  'every factory role treats as authoritative for this repo.',
                  '',
                  'The **Profiler** posts here whenever it drafts or re-checks the profile, and opens a PR',
                  'when something it verified disagrees with the file. Nothing is applied without that PR',
                  'being merged by a human.',
                  '',
                  `To re-run it: remove and re-apply the \`${PROFILE_KIND}\` label on this issue.`,
                  '',
                  '<!-- factory-agent -->',
                ].join('\n'),
              });
              core.info(`Created the profile issue #${data.number}`);
              return data;
            };

            // A parked issue must always be able to answer "what is this
            // waiting on?". Filing an issue and creating its milestone later is
            // the normal order, and in that order the `milestoned` event landed
            // on an issue already in factory:backlog and did nothing at all —
            // leaving the parking comment ("add this issue to a milestone") as
            // the only guidance on an issue that now has one. Point at the
            // tracker instead, once per tracker so re-milestoning cannot spam.
            // Notices that answer "why is nothing happening here?" must survive
            // the event firing twice (a label removed and re-added, an issue
            // re-milestoned) without repeating themselves.
            const sayOnce = async (n, marker, body) => {
              const said = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: n, per_page: 100,
              }).catch(() => []);
              if (said.some(c => (c.body || '').includes(marker))) return false;
              await say(n, `${body}\n\n${marker}`);
              return true;
            };
            // The Fast-Track role leaves this marker on the issue when it has
            // produced a PR. Re-applying the label must not open a second one.
            const fastTrackDone = async (n) => {
              const said = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: n, per_page: 100,
              }).catch(() => []);
              return said.some(c => (c.body || '').includes(FAST_TRACK_DONE));
            };
            const queuedMarker = (t) => `<!-- factory-queued:${t} -->`;
            const queuedNotice = async (n, ms, tracker) => {
              if (!tracker || !ms) return;
              if (namesOf(tracker.labels).includes('factory:release-approved')) return;
              await sayOnce(n, queuedMarker(tracker.number), [
                `Queued for release **${ms.title}** — tracked in #${tracker.number}.`,
                '',
                'Nothing runs on this issue yet, and nothing will until that release is',
                'approved at **gate G0**. To move it along, on #' + tracker.number + ':',
                '',
                '1. comment `Plan release` to get the release plan, then',
                '2. comment `Approved` to release every issue in the milestone into intake.',
              ].join('\n'));
            };

            if (ev === 'workflow_dispatch') {
              role = process.env.DISPATCH_ROLE || 'none';
              issue = process.env.DISPATCH_ISSUE || '';
              if (role === 'scrum') releaseIssue = issue;
            } else if (ev === 'milestone') {
              // A new milestone is a new release. Give it a tracker issue right
              // away so there is somewhere to plan it and somewhere to approve
              // it; the milestone itself carries no state GitHub lets us label.
              const ms = context.payload.milestone;
              if (!gating) {
                core.info('Release gating is off (.github/factory-release.json) - ignoring milestone event');
              } else if (context.payload.action === 'created' || context.payload.action === 'opened') {
                const tracker = await ensureTracker(ms);
                if (tracker) issue = String(tracker.number);
              } else {
                core.info(`Milestone ${context.payload.action} - nothing to route`);
              }
            } else if (ev === 'issue_comment') {
              const i = context.payload.issue;
              issue = String(i.number);
              const body = context.payload.comment.body || '';
              const author = context.payload.comment.user || {};
              const sender = author.login;
              const labels = namesOf(i.labels);
              const isApproval = /^\s*approved\s*[.!]?\s*$/i.test(body);
              const isPlanRelease = /^\s*plan\s+release\s*[.!]?\s*$/i.test(body);
              const isTracker = labels.includes(RELEASE_KIND);
              const assocOk = ['OWNER', 'MEMBER', 'COLLABORATOR']
                .includes(context.payload.comment.author_association);
              const authorized = (gate) => {
                const list = approverList(gate);
                return list.length ? list.includes(sender) : assocOk;
              };
              const refuse = (gate, what) => {
                const list = approverList(gate);
                return say(i.number, `@${sender} — ${what} requires ` +
                  (list.length
                    ? `approval from: ${list.map(u => '@' + u).join(', ')} (see .github/factory-approvers.json).`
                    : 'owner, member or collaborator access on this repository.'));
              };
              if (i.pull_request) {
                core.info('PR comment - skipping');
              } else if (author.type === 'Bot') {
                core.info('Bot comment - skipping');
              } else if (body.includes('<!-- factory-agent -->')) {
                core.info('Factory agent comment (marker present) - skipping');
              } else if (isTracker && isPlanRelease) {
                // Planning is not a gate — it only produces the release plan.
                // It is authorised anyway so a drive-by comment cannot spend
                // agent budget on someone else's milestone.
                if (!authorized('release_scope')) {
                  await refuse('release_scope', 'planning a release');
                } else {
                  role = 'scrum';
                  releaseIssue = issue;
                  core.info('Release planning requested - starting the Scrum Master');
                }
              } else if (isTracker && isApproval) {
                // Gate G0 — release scope. Unlike G1/G2 there is no document PR
                // to merge; approving flips the label and the release-chain job
                // releases every backlog issue in the milestone.
                if (!labels.includes('factory:release-ready')) {
                  await say(i.number,
                    `"Approved" has no effect while this release is at **${stateOf(labels)}**.\n\n` +
                    'Comment `Plan release` first — the Scrum Master reads the milestone, posts the ' +
                    'release plan and moves this tracker to `factory:release-ready`, which is gate G0.');
                } else if (!authorized('release_scope')) {
                  await refuse('release_scope', 'gate G0 (release approval)');
                } else {
                  await dropLabel(i.number, 'factory:release-ready');
                  await addLabels(i.number, ['factory:release-approved']);
                  releaseIssue = issue;
                  core.info('Gate G0 approved via comment - releasing the milestone');
                }
              } else if (isApproval && labels.includes('factory:ready')) {
                // Implementation start is NOT a gate (the gates are G0 release,
                // G1 spec, G2 design, G3 production). It needed Run workflow only
                // because labels applied by factory runs emit no trigger events, so
                // nothing picked a ready task up. Accept `Approved` as the equivalent
                // of Run workflow (role: implementer) so a task can be started from its
                // own thread. Unlike the gates there is no PR to merge, and the
                // implementer flips factory:ready -> factory:in-review itself, so the
                // router only chooses the role.
                if (!authorized('implementation')) {
                  await refuse('implementation', 'starting implementation');
                } else if (labels.includes(IN_PROGRESS)) {
                  // A second start is the one thing the state cannot refuse on
                  // its own: the implementer only leaves factory:ready when it
                  // flips to factory:in-review at the end, so the label still
                  // reads "ready" for the whole run and a second Approved would
                  // route a second implementer onto the same task and the same
                  // branch. The run marker is the fact that answers it.
                  await say(i.number,
                    '`Approved` has no effect right now — a factory run is already live on this issue ' +
                    '(`factory:in-progress`).\n\n' +
                    'The implementer is still working; approving again would start a second one on the same ' +
                    'task and the same branch. The marker is removed when the run ends, whatever the outcome — ' +
                    'if this task is still `factory:ready` then, approve again to restart it.');
                  core.info(`A run is already live on #${i.number} - not starting a second implementer`);
                } else {
                  role = 'implementer';
                  core.info('Implementation approved via comment - starting implementer');
                }
              } else if (isApproval &&
                         (labels.includes('factory:spec-ready') || labels.includes('factory:design-ready'))) {
                // Comment-approved gate (G1/G2, document PRs only — G3 stays a human merge click).
                const spec = labels.includes('factory:spec-ready');
                const gateKey = spec ? 'spec' : 'design';
                if (!authorized(gateKey)) {
                  await refuse(gateKey, `this gate (${spec ? 'G1 spec' : 'G2 design'} approval)`);
                  core.setOutput('role', 'none'); core.setOutput('issue', issue);
                  core.setOutput('issues', '[]'); core.setOutput('release_issue', '');
                  return;
                }
                const headBranch = spec ? `factory/${i.number}-spec` : `factory/${i.number}-design`;
                const { data: prs } = await github.rest.pulls.list({
                  owner, repo, state: 'open', head: `${owner}:${headBranch}`,
                });
                // Epic-branch policy (FACTORY.md §6b): with epics:true a gate
                // document merges into the epic branch, not the default
                // branch. Both gates are adoption points for an in-flight
                // epic, and the branch is ensured whether or not there is a PR
                // to retarget: the gate is also reachable by a human merging
                // the document PR themselves (the factory offers that route in
                // as many words), and keying adoption on an open PR meant that
                // route silently left the epic on legacy routing for the rest
                // of its life.
                //
                // Cutting the branch here loses nothing even when a document
                // has already merged to the default branch: it is cut FROM
                // that branch, so it carries the merged spec, and no task PR
                // can have merged yet — tasks are dispatched only after G2.
                // The reverse retarget handles a flip back to epics:false.
                const branchCfg = loadJson('.github/factory-branches.json');
                const epicsOn = branchCfg.epics === true;
                const epicBranch = `factory/epic-${i.number}`;
                const defBranch = (context.payload.repository || {}).default_branch || 'main';
                const branchExists = (name) => github.rest.repos
                  .getBranch({ owner, repo, branch: name })
                  .then(() => true, () => false);
                if (epicsOn && !(await branchExists(epicBranch))) {
                  const { data: def } = await github.rest.repos.getBranch({
                    owner, repo, branch: defBranch,
                  });
                  await github.rest.git.createRef({
                    owner, repo, ref: `refs/heads/${epicBranch}`, sha: def.commit.sha,
                  });
                  core.info(`Created epic branch ${epicBranch} from ${defBranch}`);
                }
                let allMerged = true;
                for (const pr of prs) {
                  try {
                    let wantBase = pr.base.ref;
                    if (epicsOn && pr.base.ref === defBranch) {
                      wantBase = epicBranch;
                    } else if (!epicsOn && pr.base.ref === epicBranch) {
                      wantBase = defBranch;
                    }
                    if (wantBase !== pr.base.ref) {
                      await github.rest.pulls.update({
                        owner, repo, pull_number: pr.number, base: wantBase,
                      });
                      core.info(`Retargeted gate PR #${pr.number}: base ${pr.base.ref} -> ${wantBase} (epic-branch policy §6b)`);
                    }
                    await github.rest.pulls.merge({
                      owner, repo, pull_number: pr.number, merge_method: 'squash',
                    });
                    core.info(`Merged gate PR #${pr.number}`);
                  } catch (e) {
                    allMerged = false;
                    await say(i.number,
                      `Approval noted, but PR #${pr.number} could not be merged automatically (${e.message}). ` +
                      'Please merge it manually and apply the next label.');
                  }
                }
                if (prs.length === 0) core.info(`No open gate PR on ${headBranch} (already merged manually?) - proceeding`);
                if (allMerged) {
                  await dropLabel(i.number, spec ? 'factory:spec-ready' : 'factory:design-ready');
                  await addLabels(i.number, [spec ? 'factory:spec-approved' : 'factory:design-approved']);
                  // Label flips by this token emit no events - continue the next stage in-run.
                  role = spec ? 'planner' : 'dispatch';
                  core.info(`Gate approved via comment - continuing with ${role}`);
                }
              } else if (!labels.includes('factory:blocked')) {
                // Say so when someone plainly asked for something to happen. A green
                // run that does nothing looks identical to a run that worked, so an
                // unanswered "Approved" would otherwise just sit there.
                if (isApproval) {
                  await say(i.number,
                    `"Approved" has no effect while this is at **${stateOf(labels)}** — nothing was started.\n\n` +
                    'It advances the pipeline from:\n' +
                    '- `factory:release-ready` (a release tracker) — approves gate G0 and releases the whole milestone\n' +
                    '- `factory:spec-ready` — approves gate G1 and starts the planner\n' +
                    '- `factory:design-ready` — approves gate G2 and starts the dispatcher\n' +
                    '- `factory:ready` (a task sub-issue) — starts its implementer\n\n' +
                    (labels.includes('factory:backlog')
                      ? 'This issue is in the backlog: add it to a release milestone, then approve that ' +
                        'release\'s tracker issue.\n\n'
                      : '') +
                    (labels.includes('factory:on-epic')
                      ? 'This is merged onto its epic branch and green there (FACTORY.md §6b). The Release Manager ' +
                        'carries the completed epic to the integration branch with the integration PR — nothing here ' +
                        'needs a comment approval.\n\n'
                      : '') +
                    (labels.includes('factory:in-staging')
                      ? 'This is at gate G3: it is already on the integration branch and green there, and ships when a ' +
                        'human merges the promotion PR(s) the Release Manager listed. That merge click is the gate — ' +
                        'there is nothing here for a comment to approve.\n\n'
                      : '') +
                    'From any other state, use Actions → "Factory pipeline" → Run workflow with the role you want. ' +
                    'Gate G3 (production) is deliberately not comment-approvable.');
                } else if (isPlanRelease) {
                  // `Plan release` is a tracker command. Typed on a requirement
                  // issue it routed nowhere and answered nothing, which reads
                  // as the factory ignoring you.
                  const pms = i.milestone;
                  const t = pms ? await trackerFor(pms.number) : null;
                  await say(i.number,
                    '`Plan release` only works on a **release tracker** — the issue labelled ' +
                    '`factory:release` that the factory opens for a milestone. This is a requirement ' +
                    'issue, so nothing was started.\n\n' +
                    (t
                      ? `Its release is tracked in #${t.number} — comment \`Plan release\` there.`
                      : pms
                        ? `**${pms.title}** has no release tracker yet; one is opened when the milestone ` +
                          'is created or first used.'
                        : 'This issue is not in a milestone, so there is no release to plan.'));
                }
                core.info('Issue not factory:blocked - comments only resume blocked stages or approve gates');
              } else {
                // resume the stage the issue was blocked in, inferred from its state label
                const resume = {
                  'factory:release-planning': 'scrum',
                  'factory:intake': 'intake',
                  'factory:spec-approved': 'planner',
                  'factory:planned': 'architect',
                  'factory:design-approved': 'dispatch',
                };
                for (const [l, r] of Object.entries(resume)) {
                  if (labels.includes(l)) { role = r; break; }
                }
                if (role === 'none' &&
                    labels.filter(n => n.startsWith('factory:') && n !== IN_PROGRESS)
                          .every(n => n === 'factory:blocked')) {
                  role = isTracker ? 'scrum' : 'intake';
                }
                if (role !== 'none') {
                  core.info(`Human reply on blocked issue - resuming ${role}`);
                  if (role === 'scrum') releaseIssue = issue;
                  await dropLabel(i.number, 'factory:blocked');
                } else {
                  await say(i.number,
                    `This issue is \`factory:blocked\` at **${stateOf(labels)}**, which has no automatic resume ` +
                    'step — your reply did not restart anything. Use Actions → "Factory pipeline" → Run workflow ' +
                    'with the role you want and this issue number.');
                  core.info('Blocked at a stage without an automatic resume mapping - use Run workflow');
                }
              }
            } else if (ev === 'issues') {
              const i = context.payload.issue;
              issue = String(i.number);
              const labels = namesOf(i.labels);
              const states = labels.filter(n => n.startsWith('factory:') && n !== IN_PROGRESS);
              const action = context.payload.action;
              if (action === 'opened') {
                if (i.user.type === 'Bot') {
                  core.info('Bot-authored issue - skipping');
                } else if (labels.includes(RELEASE_KIND)) {
                  core.info('Release tracker issue - skipping');
                } else if (isTaskTitle(i.title)) {
                  core.info('Factory task sub-issue - skipping');
                } else if (labels.includes(FAST_TRACK)) {
                  // Filed straight into the fast lane: no release slot, no
                  // intake, no gates — the Fast-Track role implements it now.
                  role = 'fasttrack';
                  core.info('Filed as factory:fast-track - running the fast lane');
                } else if (labels.includes(PROFILE_KIND)) {
                  // Filed with the profile label — this is the Console's setup
                  // step, or a human asking for a profile by hand. Routing it
                  // here means one API call files it and starts the Profiler;
                  // labels set at creation emit no `labeled` event of their own.
                  role = 'profiler';
                  core.info('Filed as factory:profile - drafting the repo profile');
                } else if (states.some(n => n !== 'factory:intake')) {
                  core.info('Issue already carries a factory state - skipping');
                } else {
                  // Release gating: a requirement is filed against a release, not
                  // straight into the machine. Park it until its milestone is
                  // approved at gate G0 (FACTORY.md §2d).
                  let parked = false;
                  if (gating && !labels.some(n => exemptLabels.includes(n))) {
                    const ms = i.milestone;
                    const tracker = ms ? await ensureTracker(ms) : null;
                    const approved = tracker &&
                      namesOf(tracker.labels).includes('factory:release-approved');
                    if (!approved) {
                      parked = true;
                      await dropLabel(i.number, 'factory:intake');
                      await addLabels(i.number, ['factory:backlog']);
                      if (tracker) {
                        await queuedNotice(i.number, ms, tracker);
                      } else {
                        await say(i.number, ms
                          ? `Queued for release **${ms.title}** — that milestone has no release tracker ` +
                            '(`auto_create_release_issue` is off), so nothing can approve it yet.\n\n' +
                            'Open a `release(<milestone>)` tracker issue for it, or approve gate G0 by hand.'
                          : 'Parked in `factory:backlog` — this repo runs **release-gated intake**.\n\n' +
                            'Add this issue to a milestone (the milestone *is* the release). The factory ' +
                            'opens a release tracker for it; comment `Plan release` there to get a release ' +
                            'plan, and approve it to start every issue in the release at once.\n\n' +
                            `A small change does not need a release slot: \`${FAST_TRACK}\` skips this ` +
                            'queue and hands it to the fast lane, which implements it and opens a PR for review.');
                      }
                      core.info('Release gating on - parked in factory:backlog');
                    } else {
                      core.info(`Milestone ${ms.number} is already released - entering intake now`);
                    }
                  }
                  if (!parked) {
                    if (!labels.includes('factory:intake')) {
                      await addLabels(i.number, ['factory:intake']);
                      core.info('Applied factory:intake');
                    }
                    role = 'intake';
                  }
                }
              } else if (action === 'milestoned' || action === 'demilestoned') {
                // Moving an issue in or out of a release is the only way a
                // backlog issue changes hands, so both directions are handled.
                const ms = context.payload.milestone;
                if (!gating) {
                  core.info('Release gating is off - milestone changes are informational only');
                } else if (i.user.type === 'Bot' || labels.includes(RELEASE_KIND) || isTaskTitle(i.title)) {
                  core.info('Release tracker or factory sub-issue - skipping');
                } else if (labels.some(n => exemptLabels.includes(n))) {
                  core.info('Issue is exempt from release gating - skipping');
                } else if (!notStarted(labels)) {
                  core.info(`Issue is already in flight (${states.join(', ')}) - milestone change does not move it`);
                } else if (action === 'milestoned') {
                  const tracker = ms ? await ensureTracker(ms) : null;
                  const approved = tracker && namesOf(tracker.labels).includes('factory:release-approved');
                  if (approved) {
                    await dropLabel(i.number, 'factory:backlog');
                    if (!labels.includes('factory:intake')) await addLabels(i.number, ['factory:intake']);
                    role = 'intake';
                    await say(i.number, `Added to **${ms.title}**, which is already approved (${tracker ? '#' + tracker.number : ''}) — entering intake now.`);
                  } else if (!labels.includes('factory:backlog')) {
                    await dropLabel(i.number, 'factory:intake');
                    await addLabels(i.number, ['factory:backlog']);
                    await queuedNotice(i.number, ms, tracker);
                    core.info(`Queued in milestone ${ms.number} - waiting for gate G0`);
                  } else {
                    // Already parked, but this is the first time it has a
                    // release: say which one, and what has to happen next.
                    await queuedNotice(i.number, ms, tracker);
                    core.info(`Queued in milestone ${ms.number} - already in factory:backlog`);
                  }
                } else if (!labels.includes('factory:backlog')) {
                  await dropLabel(i.number, 'factory:intake');
                  await addLabels(i.number, ['factory:backlog']);
                  await say(i.number, `Removed from **${ms ? ms.title : 'its milestone'}** — parked in \`factory:backlog\` until it is part of an approved release.`);
                }
              } else if (action === 'closed') {
                // A task closing is what unblocks its dependents, and nothing else
                // observes that: the dispatcher only ran when the epic reached
                // factory:design-approved, so tasks freed by a later merge were
                // never released and sat with no factory:* label at all.
                // Re-dispatch the parent epic; the dispatcher is a no-op for tasks
                // whose dependencies are still open, and skips any task that
                // already carries a state label.
                const m = /^task\((\d+)\)/.exec(i.title || '');
                if (!m) {
                  core.info('Not a factory task sub-issue - nothing to re-dispatch');
                } else {
                  const epic = m[1];
                  // The epic is not necessarily in this repo. A cross-repo epic
                  // (FACTORY.md §7) keeps its tasks in the repos that implement them
                  // and the epic where it was filed; the task body carries the
                  // qualified "Part of owner/repo#N" marker for exactly this.
                  // Looking #N up here instead found nothing — or an unrelated issue
                  // that happens to have that number — so the dependents of every
                  // closed task in a cross-repo epic were never released, silently.
                  const ref = epicRefFromBody(i.body);
                  const elsewhere = ref.repo && ref.repo !== `${owner}/${repo}` &&
                                    (ref.number === null || String(ref.number) === epic)
                                      ? ref.repo : null;
                  const [epicOwner, epicRepo] = (elsewhere || `${owner}/${repo}`).split('/');
                  // A PAT is the only way out of this repo. Without one, say on the
                  // task what has to be run over there rather than failing quietly.
                  const client = elsewhere
                    ? (process.env.CROSS_TOKEN ? require('@actions/github').getOctokit(process.env.CROSS_TOKEN) : null)
                    : github;
                  if (elsewhere && !client) {
                    await say(i.number,
                      `This task belongs to epic **${elsewhere}#${epic}**, in another repository, ` +
                      'and this pipeline has no cross-repo access (`FACTORY_CROSS_REPO_TOKEN` is not set), ' +
                      'so it cannot release the tasks this one unblocks.\n\n' +
                      `On **${elsewhere}**: Actions → "Factory pipeline" → Run workflow (role: \`dispatch\`, issue \`${epic}\`), ` +
                      'or press **Start factory run** on that epic in the Factory Console.');
                    core.info(`Epic ${elsewhere}#${epic} is in another repo and no cross-repo token is set`);
                  } else {
                    // Only while the epic is in its implementation phase. Once it has
                    // moved on (or never got through G2) a re-dispatch is meaningless.
                    const { data: parent } = await client.rest.issues.get({
                      owner: epicOwner, repo: epicRepo, issue_number: Number(epic),
                    }).catch(() => ({ data: null })) || {};
                    const parentLabels = parent ? namesOf(parent.labels) : [];
                    if (!parentLabels.includes('factory:design-approved')) {
                      core.info(`Epic ${epicOwner}/${epicRepo}#${epic} is not factory:design-approved - not re-dispatching`);
                    } else if (elsewhere) {
                      // The dispatcher has to run over there, in that repo's own
                      // pipeline — this run cannot check out another repo's factory
                      // config and act as it.
                      await client.rest.actions.createWorkflowDispatch({
                        owner: epicOwner, repo: epicRepo,
                        workflow_id: 'factory-pipeline.yml',
                        ref: 'main',
                        inputs: { role: 'dispatch', issue_number: epic },
                      }).then(() => {
                        core.info(`Task #${i.number} closed - dispatched ${elsewhere}#${epic} to release dependents`);
                      }).catch(async (e) => {
                        await say(i.number,
                          `This task belongs to epic **${elsewhere}#${epic}**, and starting its dispatcher ` +
                          `over there failed: ${e.message}.\n\n` +
                          `On **${elsewhere}**: Actions → "Factory pipeline" → Run workflow (role: \`dispatch\`, issue \`${epic}\`), ` +
                          'or press **Start factory run** on that epic in the Factory Console.');
                        core.info(`Cross-repo dispatch to ${elsewhere} failed: ${e.message}`);
                      });
                    } else {
                      role = 'dispatch';
                      issue = epic;
                      core.info(`Task #${i.number} closed - re-dispatching epic #${epic} to release dependents`);
                    }
                  }
                }
              } else if (action === 'labeled') {
                // factory:planned is intentionally NOT mapped: the architect is
                // chained in-run after the planner (mapping it would double-run
                // the architect when PAT label flips emit events).
                const name = context.payload.label.name;
                const sender = context.payload.sender.login;
                // An App's write is the factory's own, not a person walking
                // past a gate. This engine's workflow token emits no events so
                // it never saw the problem, but a PAT-driven repo does — and
                // the orchestrator engine, which acts as an App, reverted the
                // very label it had just applied after a gate approval and
                // left the epic carrying no state at all. Same rule as the
                // comment router skipping Bot authors.
                const senderIsApp = context.payload.sender.type === 'Bot' ||
                                    /\[bot\]$/.test(sender || '');
                if (name === IN_PROGRESS) {
                  // The pipeline's own "a run is live" marker. It is applied
                  // with the workflow token, which emits no events — but a repo
                  // whose FACTORY_CROSS_REPO_TOKEN PAT applies labels does emit
                  // them, and that event must route nowhere.
                  core.info(`${IN_PROGRESS} is a run marker applied by this pipeline - nothing to route`);
                  core.setOutput('role', 'none'); core.setOutput('issue', issue);
                  core.setOutput('issues', '[]'); core.setOutput('release_issue', '');
                  return;
                }
                const gateOf = {
                  'factory:release-approved': 'release_scope',
                  'factory:spec-approved': 'spec',
                  'factory:design-approved': 'design',
                };
                const map = { 'factory:spec-approved': 'planner', 'factory:design-approved': 'dispatch' };
                if (gateOf[name]) {
                  const list = approverList(gateOf[name]);
                  if (list.length && !list.includes(sender) && !senderIsApp) {
                    // Unauthorized gate flip: revert and explain.
                    await dropLabel(i.number, name);
                    await say(i.number,
                      `\`${name}\` was applied by @${sender}, but this gate requires ` +
                      `${list.map(u => '@' + u).join(', ')} (see .github/factory-approvers.json). Reverted.`);
                  } else if (name === 'factory:release-approved') {
                    // Gate G0 flipped by hand (or by the Scrum Master in
                    // "approval": "agent" mode, when a PAT makes label flips
                    // emit events). release-chain does the batch release and
                    // is idempotent, so a duplicate event is harmless.
                    await dropLabel(i.number, 'factory:release-ready');
                    releaseIssue = issue;
                  } else {
                    role = map[name];
                  }
                }
                // Hand-off labels: notify the responsible approvers (assign + mention).
                const notifyOf = { 'factory:release-ready': ['release_scope', 'Gate G0 (release approval)'],
                                   'factory:spec-ready': ['spec', 'Gate G1 (spec approval)'],
                                   'factory:design-ready': ['design', 'Gate G2 (design approval)'],
                                   'factory:in-staging': ['release', 'Gate G3 (promotion to the default branch)'],
                                   'factory:ready': ['implementation', 'Implementation start'] };
                if (notifyOf[name]) {
                  const [gate, what] = notifyOf[name];
                  const list = approverList(gate);
                  if (list.length) {
                    await github.rest.issues.addAssignees({
                      owner, repo, issue_number: i.number, assignees: list,
                    }).catch(() => {});
                    const how = gate === 'implementation'
                      ? 'Comment exactly "Approved" here to start it, or use Actions → "Factory pipeline" → Run workflow (role: implementer, this issue number).'
                      : gate === 'release_scope'
                        ? 'Read the release plan above, then comment exactly "Approved" here to release every issue in this milestone into intake.'
                        : gate === 'release'
                          ? 'This is already merged onto the integration branch and green there (FACTORY.md §6a) — the Release Manager\'s integration report above is the evidence. Merge the promotion PR(s) it lists, in that order, via the GitHub UI. G3 is deliberately not comment-approvable.'
                          : 'Review the linked PR, then merge it + apply the approved label, or comment exactly "Approved" here.';
                    await say(i.number, `${list.map(u => '@' + u).join(' ')} — **${what}** is waiting on you. ${how}`);
                  }
                }
                // Re-applying the profile label is how a redraft is asked for
                // (FACTORY.md §2c) — the Profiler removes it when it finishes,
                // so this is a plain add rather than the remove-then-add dance
                // the state labels need.
                if (name === PROFILE_KIND) {
                  role = 'profiler';
                  core.info('factory:profile applied - running the Profiler');
                }
                // The fast lane. Skipping OpenSpec ceremony does not mean
                // skipping the work: the Fast-Track role implements the change
                // and opens a PR for human review, which is the whole point of
                // calling something small.
                if (name === FAST_TRACK) {
                  // A state past intake means the normal pipeline already
                  // invested in this issue; the label must not hijack it.
                  const otherStates = labels.filter(n => n.startsWith('factory:') && n !== FAST_TRACK);
                  const inFlight = !otherStates.every(n =>
                    ['factory:backlog', 'factory:intake', ...ORTHOGONAL].includes(n));
                  if (inFlight) {
                    await say(i.number,
                      `\`${FAST_TRACK}\` was applied, but this issue is already at **${stateOf(labels)}** — ` +
                      'the fast lane does not take over work the pipeline has started. Remove the label to ' +
                      'carry on, or close this issue and file the small change separately.');
                    core.info(`Fast-track on an in-flight issue (${otherStates.join(', ')}) - not running`);
                  } else if (await fastTrackDone(i.number)) {
                    core.info('Fast-track already opened a PR for this issue - not running again');
                  } else {
                    // It leaves the release queue and the intake queue: the
                    // fast lane is the whole pipeline for this issue.
                    await dropLabel(i.number, 'factory:backlog');
                    await dropLabel(i.number, 'factory:intake');
                    role = 'fasttrack';
                    core.info('factory:fast-track applied - running the fast lane');
                  }
                }
              }
            } else if (ev === 'push') {
              // Stack drift (§2c). The caller stub fires this only when a
              // manifest, lockfile, CI workflow or tool config changed — the
              // places a profile goes stale from — and only the default branch
              // counts, since that is what every role checks out. The Profiler
              // re-verifies and opens a PR only where it disagrees with the
              // file, so a check that finds nothing costs one comment.
              const ref = context.payload.ref || '';
              const def = 'refs/heads/' + ((context.payload.repository || {}).default_branch || '');
              if (!def || ref !== def) {
                core.info(`Push to ${ref || '(unknown ref)'} - profile drift is only checked on the default branch`);
              } else {
                const prof = await ensureProfileIssue();
                issue = String(prof.number);
                role = 'profiler';
                core.info(`Profile-relevant paths changed on ${ref} - re-checking on #${prof.number}`);
              }
            }
            // A matrix with no values is a workflow error, so never claim a role
            // without at least one issue to run it against.
            if (role !== 'none' && !issues.length && issue) issues = [issue];
            if (role !== 'none' && !issues.length) {
              core.info(`Role ${role} has no issue to run against - dropping it`);
              role = 'none';
            }
            core.setOutput('role', role);
            core.setOutput('issue', issue);
            core.setOutput('issues', JSON.stringify(issues.map(String)));
            core.setOutput('release_issue', releaseIssue);
            core.info(`route: role=${role} issue=${issue} issues=${JSON.stringify(issues)} release_issue=${releaseIssue || '-'}`);

  agent:
    needs: route
    if: needs.route.outputs.role != 'none' && needs.route.outputs.role != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Usually a single issue. A release batch runs the same role over every
      # issue the milestone released; one failure must not cancel the rest.
      fail-fast: false
      max-parallel: 4
      matrix:
        issue: ${{ fromJSON(needs.route.outputs.issues) }}
    steps:
      - name: Require Anthropic credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Add ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) to this repo's Actions secrets (Settings -> Secrets and variables -> Actions) to run factory agents."
            exit 1
          fi
      - name: Mark the issue in progress
        # Paired with "Clear the in-progress marker" (always()) at the end of
        # this job. A role runs for minutes; without this the issue looks
        # identical to one nothing has started on, and the only way to tell was
        # to go and read the Actions tab.
        #
        # Deliberately github.token and not FACTORY_CROSS_REPO_TOKEN: labels
        # applied by the workflow token emit no events (GitHub anti-recursion),
        # so a purely cosmetic marker can never trigger another pipeline run.
        # Failing to label must never fail a run that would otherwise work.
        if: matrix.issue != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.issue }}
          ROLE: ${{ needs.route.outputs.role }}
        run: |
          # Self-healing: repos set up before this label existed never re-run
          # setup-labels.sh, so create it on first use (422 = already there).
          gh api "repos/$GITHUB_REPOSITORY/labels" \
            -f name='factory:in-progress' -f color='1F6FEB' \
            -f description='A factory agent run is live on this issue right now' \
            >/dev/null 2>&1 || true
          echo '{"labels":["factory:in-progress"]}' | gh api -X POST \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels" --input - >/dev/null
          echo "Marked #$ISSUE factory:in-progress for the $ROLE run."
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start epic-scoped roles on the epic branch (§6b)
        env:
          ISSUE: ${{ matrix.issue }}
          ROLE: ${{ needs.route.outputs.role }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # With the org policy's epics:true, an epic's approved change folder
          # lives on factory/epic-<epic> and nowhere else until promotion
          # (FACTORY.md §6b). Roles whose issue IS the epic start checked out
          # there; task-scoped roles (implementer/reviewer/qa) resolve their
          # epic in-session per their step 0a. Missing policy or epics:false
          # leaves the default checkout.
          case "$ROLE" in
            planner|architect|dispatch|release|ops) ;;
            *) echo "Role $ROLE resolves its own branches - default checkout kept"; exit 0 ;;
          esac
          EPICS=$(python3 -c "
          import json
          try: print(json.load(open('.github/factory-branches.json')).get('epics') is True)
          except Exception: print(False)" 2>/dev/null || echo False)
          if [ "$EPICS" != "True" ]; then
            echo "Epic-branch policy off - default checkout kept"; exit 0
          fi
          BR="factory/epic-$ISSUE"
          if ! git fetch origin "$BR" 2>/dev/null; then
            # The planner and the architect both run before gate G2, so no
            # task has been dispatched and a branch cut now strands nothing.
            # This is the other adoption point: a gate closed by a human
            # merging the document PR and applying the label reaches no
            # gate-approval path, and without this the epic would keep
            # building on the default branch. After G2 (dispatch, release,
            # ops) a missing branch means a genuinely pre-flip epic — its
            # tasks may already have merged onto the integration branch, so
            # cutting one here would strand them.
            case "$ROLE" in
              planner|architect) ;;
              *) echo "No $BR on the remote (pre-flip epic) - default checkout kept"; exit 0 ;;
            esac
            DEF="$DEFAULT_BRANCH"
            [ -n "$DEF" ] || DEF=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | cut -d/ -f2-)
            [ -n "$DEF" ] || DEF=main
            if git push origin "origin/$DEF:refs/heads/$BR" && git fetch origin "$BR"; then
              echo "Cut epic branch $BR from $DEF (§6b adoption)"
            else
              echo "Could not cut $BR from $DEF - default checkout kept"; exit 0
            fi
          fi
          git checkout -B "$BR" FETCH_HEAD
          echo "Checked out epic branch $BR"
      - name: Load factory role definition
        id: roledef
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_REPO_INPUT: ${{ inputs.factory_repo }}
          FACTORY_REF: ${{ inputs.factory_ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ROLE: ${{ needs.route.outputs.role }}
        run: |
          # Cloned outside the workspace on purpose: an agent running `git add -A`
          # in the repo must not be able to sweep the factory into its PR.
          FACTORY_REPO="${FACTORY_REPO_INPUT:-}"
          if [ -z "$FACTORY_REPO" ]; then
            # github.workflow_ref names the CALLER's workflow (a reusable
            # workflow gets no ref of its own), so a stub that omits
            # factory_repo used to clone the caller's own repo at v1 and die.
            # The run's referenced workflows record the repo the uses: line
            # actually resolved to — take the factory's owner/repo from there.
            FACTORY_REPO=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --jq '[.referenced_workflows[]?.path | select(contains(".github/workflows/factory-pipeline.yml"))][0] // ""' \
              2>/dev/null | cut -d/ -f1-2)
          fi
          if [ -z "$FACTORY_REPO" ]; then
            FACTORY_REPO=$(printf '%s' "$WORKFLOW_REF" | cut -d/ -f1-2)
          fi
          echo "Cloning factory $FACTORY_REPO@$FACTORY_REF"
          if ! GIT_TERMINAL_PROMPT=0 git clone --depth 1 --branch "$FACTORY_REF" \
              "https://github.com/$FACTORY_REPO" "$RUNNER_TEMP/factory"; then
            echo "::error::Could not clone https://github.com/$FACTORY_REPO (ref $FACTORY_REF). Pass factory_repo on the caller stub — the same owner/repo as the uses: line. A missing repository looks like: fatal: could not read Username for 'https://github.com'."
            exit 1
          fi
          ROLE_FILE="$RUNNER_TEMP/factory/commands/$ROLE.md"
          if [ ! -f "$ROLE_FILE" ]; then
            echo "::error::No role definition '$ROLE' in $FACTORY_REPO@$FACTORY_REF"
            exit 1
          fi
          {
            echo 'text<<FACTORY_DEF_EOF'
            cat "$RUNNER_TEMP/factory/FACTORY.md"
            printf '\n\n===== ROLE INSTRUCTIONS (%s) =====\n\n' "$ROLE"
            cat "$ROLE_FILE"
            echo 'FACTORY_DEF_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Snapshot issue state (no-op guard)
        id: before
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          ISSUE: ${{ matrix.issue }}
        run: |
          # Paired with "Verify the role changed something" below. A role that
          # neither moves the state label nor says anything has done nothing,
          # and must not report success.
          #
          # factory:in-progress is filtered out of both snapshots: this job
          # applies it before the role runs and removes it after, so counting it
          # would make every run look like it had moved a label.
          if [ -z "$ISSUE" ]; then
            echo "No issue number for this run - skipping the no-op guard."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SNAP=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" \
                   --jq '"\(.comments)|\([.labels[].name | select(startswith("factory:")) | select(. != "factory:in-progress")] | sort | join(","))"')
          echo "snap=$SNAP" >> "$GITHUB_OUTPUT"
          echo "Before: $SNAP"
      - name: Install Claude Code CLI (model probe)
        run: npm install -g @anthropic-ai/claude-code
      - name: Resolve model (first accessible in preference chain)
        id: model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ROLE: ${{ needs.route.outputs.role }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          CHAIN=$(python3 -c "import json;m=json.load(open('.github/factory-models.json'));v=m.get('$ROLE',['claude-sonnet-5']);print(' '.join(v if isinstance(v,list) else [v]))" 2>/dev/null || echo claude-sonnet-5)
          echo "Preference chain for $ROLE: $CHAIN"
          MODEL=""
          for m in $CHAIN; do
            echo "Probing model access: $m"
            if timeout 120 claude -p "Reply with exactly: OK" --model "$m" --max-turns 1 >/dev/null 2>&1; then
              MODEL="$m"; echo "Selected model: $m"; break
            fi
            echo "::warning::Model $m is not accessible with this credential - trying next in chain"
          done
          if [ -z "$MODEL" ]; then
            echo "::error::No model in the preference chain is accessible - check credentials/plan or edit .github/factory-models.json"
            exit 1
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
      - name: Run factory role
        if: github.event_name != 'push'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          OPENSPEC_TELEMETRY: "0"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The factory files its own issues (a fast-track fix a role split out
          # of the issue it was working on, a release tracker), and the router
          # decides whether one is worth a run. claude-code-action refuses any
          # non-human actor unless it is listed here, so without this the
          # router's decision never reached the agent: the job died at
          # "Workflow initiated by non-human actor". See the routing note above.
          allowed_bots: ${{ inputs.allowed_bots }}
          prompt: |
            You are running the "${{ needs.route.outputs.role }}" role of the
            Software Factory inside GitHub Actions, on repository
            ${{ github.repository }}.

            The factory handbook and your role instructions follow verbatim
            below. Execute the role instructions, treating number
            ${{ matrix.issue }} as the issue/PR argument
            ($ARGUMENTS).

            Repo-specific facts (stack, test/build commands, conventions) live
            in .factory/profile.json in the checked-out repository — your role
            instructions tell you when to read it.

            Operating rules:
            - Use the gh CLI for GitHub operations (labels, comments, PRs); GH_TOKEN is set.
            - HARD RULES: never push to main or master; never merge a pull request;
              perform exactly one factory role in this run.
            - End EVERY comment you post on an issue or PR with a line containing
              exactly: <!-- factory-agent -->
              (it stops your own comments from re-triggering the pipeline).
            - The pipeline puts `factory:in-progress` on your issue for the
              lifetime of this run and takes it off when the run ends. It is a
              marker, not a pipeline state: ignore it when you read the issue's
              labels, and never add or remove it yourself.

            Cross-repo epics: if the change folder lists other repos in this
            estate and GH_TOKEN has cross-repo access (FACTORY_CROSS_REPO_TOKEN
            secret), operate on them with the gh CLI —
            `gh repo clone ${{ github.repository_owner }}/<repo> /tmp/<repo>` — and
            create sub-issues, push factory branches and open PRs there as the role
            requires (never to main/master). If the role needs cross-repo access and the
            token cannot reach the other repo, comment on the epic that the
            FACTORY_CROSS_REPO_TOKEN secret is required and apply factory:blocked.

            Note on triggering: with the default workflow token, label changes you make
            do NOT emit trigger events (GitHub anti-recursion); with the
            FACTORY_CROSS_REPO_TOKEN PAT they DO. Either way: apply exactly the state
            labels your role instructions specify — never extra ones — and let the
            pipeline's own routing decide what runs next.

            ===== FACTORY HANDBOOK =====

            ${{ steps.roledef.outputs.text }}
          # Headless runs have no one to answer a permission prompt, so anything
          # not explicitly allowed here is DENIED. Without this block the role
          # reads the repo, then silently fails to run `gh`, write files or
          # commit — the run goes green and the epic sits at its current label.
          # Keep in sync with the same list in factory-test.yml.
          #
          # 100 turns, not 50: roles that verify their own work by running the
          # repo's build and test suites (profiler, implementer, qa) legitimately
          # burn turns on it, and the action fails the job on the count even
          # after the role delivered (a Profiler run opened its PR, posted its
          # evidence, then went red at "successful result after 52 turns,
          # exceeding the configured maximum of 50"). The no-op guard below is
          # what catches runs that spend turns achieving nothing.
          claude_args: |
            --max-turns 100
            --model ${{ steps.model.outputs.model }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,TodoWrite,Task,Skill"
      - name: Run factory role (push)
        # claude-code-action@v1 rejects push ("Unsupported event type: push").
        # Profile drift is a push trigger, so the Profiler never reaches the
        # agent unless this path runs. Same CLI invocation as factory-test.yml.
        if: github.event_name == 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          OPENSPEC_TELEMETRY: "0"
          ROLE: ${{ needs.route.outputs.role }}
          ISSUE: ${{ matrix.issue }}
          MODEL: ${{ steps.model.outputs.model }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          {
            cat <<PROMPT
          You are running the "$ROLE" role of the
          Software Factory inside GitHub Actions, on repository
          $GITHUB_REPOSITORY.

          The factory handbook and your role instructions follow verbatim
          below. Execute the role instructions, treating number
          $ISSUE as the issue/PR argument
          (\$ARGUMENTS).

          Repo-specific facts (stack, test/build commands, conventions) live
          in .factory/profile.json in the checked-out repository — your role
          instructions tell you when to read it.

          Operating rules:
          - Use the gh CLI for GitHub operations (labels, comments, PRs); GH_TOKEN is set.
          - HARD RULES: never push to main or master; never merge a pull request;
            perform exactly one factory role in this run.
          - End EVERY comment you post on an issue or PR with a line containing
            exactly: <!-- factory-agent -->
            (it stops your own comments from re-triggering the pipeline).
          - The pipeline puts \`factory:in-progress\` on your issue for the
            lifetime of this run and takes it off when the run ends. It is a
            marker, not a pipeline state: ignore it when you read the issue's
            labels, and never add or remove it yourself.

          Cross-repo epics: if the change folder lists other repos in this
          estate and GH_TOKEN has cross-repo access (FACTORY_CROSS_REPO_TOKEN
          secret), operate on them with the gh CLI —
          \`gh repo clone ${GITHUB_REPOSITORY_OWNER}/<repo> /tmp/<repo>\` — and
          create sub-issues, push factory branches and open PRs there as the role
          requires (never to main/master). If the role needs cross-repo access and the
          token cannot reach the other repo, comment on the epic that the
          FACTORY_CROSS_REPO_TOKEN secret is required and apply factory:blocked.

          Note on triggering: with the default workflow token, label changes you make
          do NOT emit trigger events (GitHub anti-recursion); with the
          FACTORY_CROSS_REPO_TOKEN PAT they DO. Either way: apply exactly the state
          labels your role instructions specify — never extra ones — and let the
          pipeline's own routing decide what runs next.

          ===== FACTORY HANDBOOK =====

          PROMPT
            cat "$RUNNER_TEMP/factory/FACTORY.md"
            printf '\n\n===== ROLE INSTRUCTIONS (%s) =====\n\n' "$ROLE"
            cat "$RUNNER_TEMP/factory/commands/$ROLE.md"
          } > "$RUNNER_TEMP/prompt.md"
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --model "$MODEL" \
            --max-turns 100 \
            --permission-mode acceptEdits \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,TodoWrite,Task,Skill"
      - name: Verify the role changed something (no-op guard)
        if: steps.before.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          ISSUE: ${{ matrix.issue }}
          ROLE: ${{ needs.route.outputs.role }}
          BEFORE: ${{ steps.before.outputs.snap }}
        run: |
          # claude-code-action exits 0 even when every tool call was denied, so a
          # role that accomplished nothing still reports success and the issue
          # sits at its label forever. Require a visible trace instead.
          #
          # The trace is "state label moved OR a comment was posted" rather than
          # "label moved": a role may legitimately decline to advance the issue
          # (intake recommending fast-track, any role applying factory:blocked)
          # but it always says so on the issue first.
          AFTER=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" \
                    --jq '"\(.comments)|\([.labels[].name | select(startswith("factory:")) | select(. != "factory:in-progress")] | sort | join(","))"')
          echo "Before: $BEFORE"
          echo "After:  $AFTER"
          if [ "$AFTER" != "$BEFORE" ]; then
            echo "Role '$ROLE' left a trace on #$ISSUE."
            exit 0
          fi
          DENIALS=$(jq -r '[.. | objects | select(has("permission_denials_count")) | .permission_denials_count] | last // 0' \
                      "$RUNNER_TEMP/claude-execution-output.json" 2>/dev/null || echo 0)
          [ -n "$DENIALS" ] || DENIALS=0
          HINT="Check the role's own log above for where it stopped."
          if [ "$DENIALS" -gt 0 ]; then
            HINT="$DENIALS tool permission denial(s) were recorded - the --allowedTools list in this workflow is the likely cause."
          fi
          echo "::error::Role '$ROLE' finished but changed nothing on #$ISSUE - no factory:* label change and no new comment. $HINT"
          exit 1
      - name: Say what happens next
        # Every run leaves the issue saying what is expected of the next
        # actor. A role that finished cleanly used to say nothing at all: the
        # label moved and the thread went quiet, and the states with no
        # trigger of their own (in-review, in-test, ready-to-ship) were the
        # pipeline waiting on a human with nothing on the issue to say so.
        #
        # After the no-op guard on purpose — this comment must never be the
        # "visible trace" that lets a role which did nothing pass for one that
        # worked. github.token, like every other notice here: a comment from
        # the workflow token emits no events and can never trigger a run.
        if: success() && matrix.issue != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.issue }}
          ROLE: ${{ needs.route.outputs.role }}
        run: python3 "$RUNNER_TEMP/factory/scripts/say_next_step.py"
      - name: Report the failure on the issue
        # A dead run is otherwise a red X on an Actions tab nobody watches: the
        # issue thread is where the humans (and the Factory Console) already
        # look, so a failure has to say so there. github.token on purpose — a
        # comment from the workflow token emits no events, so this can never
        # trigger another pipeline run; and continue-on-error because failing
        # to report a failure must not eat the cleanup step below.
        if: failure() && matrix.issue != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.issue }}
          ROLE: ${{ needs.route.outputs.role }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="⚠️ The **$ROLE** run failed — [open the run log]($RUN_URL) for the reason (missing credentials, a missing Claude GitHub App install, tool permission denials, and the turn limit are the usual ones). Work it completed before failing may still have landed — check this thread and any PR it links before re-triggering, so a re-run doesn't redo delivered work.

          <!-- factory-agent -->"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
            -f body="$BODY" >/dev/null
          echo "Reported the failed $ROLE run on #$ISSUE."
      - name: Clear the in-progress marker
        # always(), and last: the marker must come off when the role fails, when
        # the no-op guard fails it, and when the 45-minute timeout cancels the
        # job — a marker that outlives its run is worse than no marker at all.
        if: always() && matrix.issue != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.issue }}
        run: |
          gh api -X DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels/factory%3Ain-progress" \
            >/dev/null 2>&1 || true
          echo "Cleared factory:in-progress from #$ISSUE."

  release-chain:
    # Gate G0's mechanical half: once a release tracker carries
    # factory:release-approved, every backlog issue in its milestone is moved to
    # factory:intake and handed to the release-intake matrix below.
    #
    # It runs in two situations, which is why it keys on the label rather than
    # on how it got there:
    #   - a human (or the router, after an `Approved` comment) approved the
    #     release; the agent job never ran
    #   - "approval": "agent" — the Scrum Master approved its own release plan
    #     during the run that just finished
    needs: [route, agent]
    if: >-
      always() &&
      needs.route.outputs.release_issue != '' &&
      needs.agent.result != 'failure' &&
      needs.agent.result != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.release.outputs.issues }}
      count: ${{ steps.release.outputs.count }}
    steps:
      - id: release
        uses: actions/github-script@v7
        env:
          RELEASE_ISSUE: ${{ needs.route.outputs.release_issue }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const n = Number(process.env.RELEASE_ISSUE);
            const namesOf = (ls) => (ls || []).map(l => (typeof l === 'string' ? l : l.name));
            core.setOutput('issues', '[]');
            core.setOutput('count', '0');

            const { data: tracker } = await github.rest.issues.get({ owner, repo, issue_number: n });
            if (!namesOf(tracker.labels).includes('factory:release-approved')) {
              core.info(`Release #${n} is not factory:release-approved - nothing to release.`);
              return;
            }
            // Idempotence marker. Both an approval event and the in-run chain can
            // land on the same release (a PAT makes agent label flips emit
            // events); the second one must not start every intake twice.
            const MARK = '<!-- factory-release-dispatched -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: n, per_page: 100,
            });
            if (comments.some(c => (c.body || '').includes(MARK))) {
              core.info(`Release #${n} was already dispatched - skipping.`);
              return;
            }
            const m = /^release\((\d+)\):/.exec(tracker.title || '');
            if (!m) {
              core.info(`#${n} does not name a milestone in its title - skipping.`);
              return;
            }
            const members = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, milestone: m[1], state: 'open', per_page: 100,
            });
            const started = [], skipped = [];
            for (const it of members) {
              if (it.pull_request) continue;
              const ls = namesOf(it.labels);
              if (ls.includes('factory:release')) continue;          // the tracker itself
              if (/^task\(\d+\)/.test(it.title || '')) continue;      // factory sub-issues
              // factory:blocked and factory:in-progress say nothing about where
              // the issue is in the pipeline, so neither holds it back here.
              const inflight = ls.filter(x => x.startsWith('factory:') &&
                !['factory:backlog', 'factory:intake', 'factory:blocked', 'factory:in-progress'].includes(x));
              if (inflight.length) { skipped.push(`#${it.number} — already \`${inflight.join('`, `')}\``); continue; }
              if (ls.includes('factory:backlog')) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: it.number, name: 'factory:backlog',
                }).catch(() => {});
              }
              if (!ls.includes('factory:intake')) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: it.number, labels: ['factory:intake'],
                });
              }
              started.push(it.number);
            }
            const lines = [`**Gate G0 approved** — releasing milestone \`${tracker.title.replace(/^release\(\d+\):\s*/, '')}\`.`, ''];
            lines.push(started.length
              ? `${started.length} issue(s) enter intake now:\n` + started.map(x => `- #${x} → \`factory:intake\``).join('\n')
              : '_No backlog issues in this milestone — nothing to start._');
            if (skipped.length) {
              lines.push('', 'Already in flight, left where they are:', ...skipped.map(s => `- ${s}`));
            }
            lines.push('', 'Issues added to this milestone from now on enter intake immediately.', '', MARK);
            await github.rest.issues.createComment({
              owner, repo, issue_number: n, body: lines.join('\n') + '\n\n<!-- factory-agent -->',
            });
            core.setOutput('issues', JSON.stringify(started.map(String)));
            core.setOutput('count', String(started.length));
            core.info(`Released ${started.length} issue(s) from milestone ${m[1]}`);

  release-intake:
    # The release batch. Same steps as the `agent` job with the role fixed to
    # intake — a called workflow cannot re-enter itself, and labels this run
    # applies emit no events, so the fan-out has to happen in-run.
    # Keep in sync with the `agent` job above.
    needs: [route, release-chain]
    # A skip propagates down the whole needs chain from the point it happens,
    # and on a human gate-G0 approval `agent` never runs — the router flips the
    # label and no role is dispatched, so `agent` is skipped. release-chain
    # survives that with always(); this job did not, so it inherited the skip
    # and every human-approved release moved its issues to factory:intake and
    # then started nothing. It only ever worked in "approval": "agent" mode,
    # where the Scrum Master's own job succeeds and nothing propagates.
    #
    # always() also switches off the implicit "all needs succeeded" check, so
    # release-chain's result has to be asserted explicitly.
    if: >-
      always() &&
      needs.release-chain.result == 'success' &&
      needs.release-chain.outputs.count != '' &&
      needs.release-chain.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        issue: ${{ fromJSON(needs.release-chain.outputs.issues) }}
    steps:
      - name: Require Anthropic credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Add ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) to this repo's Actions secrets (Settings -> Secrets and variables -> Actions) to run factory agents."
            exit 1
          fi
      - name: Mark the issue in progress
        # See the same step in the `agent` job. A release batch is exactly where
        # this matters most: gate G0 starts an intake on every issue in the
        # milestone at once, four at a time, and nothing on the issues said
        # which of them were running.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.issue }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/labels" \
            -f name='factory:in-progress' -f color='1F6FEB' \
            -f description='A factory agent run is live on this issue right now' \
            >/dev/null 2>&1 || true
          echo '{"labels":["factory:in-progress"]}' | gh api -X POST \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels" --input - >/dev/null
          echo "Marked #$ISSUE factory:in-progress for the intake run."
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load factory role definition
        id: roledef
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_REPO_INPUT: ${{ inputs.factory_repo }}
          FACTORY_REF: ${{ inputs.factory_ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          # Factory resolution mirrors the agent job: referenced workflows name
          # the repo the uses: line resolved to; workflow_ref names the caller.
          FACTORY_REPO="${FACTORY_REPO_INPUT:-}"
          if [ -z "$FACTORY_REPO" ]; then
            FACTORY_REPO=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --jq '[.referenced_workflows[]?.path | select(contains(".github/workflows/factory-pipeline.yml"))][0] // ""' \
              2>/dev/null | cut -d/ -f1-2)
          fi
          if [ -z "$FACTORY_REPO" ]; then
            FACTORY_REPO=$(printf '%s' "$WORKFLOW_REF" | cut -d/ -f1-2)
          fi
          echo "Cloning factory $FACTORY_REPO@$FACTORY_REF"
          if ! GIT_TERMINAL_PROMPT=0 git clone --depth 1 --branch "$FACTORY_REF" \
              "https://github.com/$FACTORY_REPO" "$RUNNER_TEMP/factory"; then
            echo "::error::Could not clone https://github.com/$FACTORY_REPO (ref $FACTORY_REF). Pass factory_repo on the caller stub — the same owner/repo as the uses: line. A missing repository looks like: fatal: could not read Username for 'https://github.com'."
            exit 1
          fi
          {
            echo 'text<<FACTORY_DEF_EOF'
            cat "$RUNNER_TEMP/factory/FACTORY.md"
            printf '\n\n===== ROLE INSTRUCTIONS (intake) =====\n\n'
            cat "$RUNNER_TEMP/factory/commands/intake.md"
            echo 'FACTORY_DEF_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Snapshot issue state (no-op guard)
        id: before
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          ISSUE: ${{ matrix.issue }}
        run: |
          SNAP=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" \
                   --jq '"\(.comments)|\([.labels[].name | select(startswith("factory:")) | select(. != "factory:in-progress")] | sort | join(","))"')
          echo "snap=$SNAP" >> "$GITHUB_OUTPUT"
          echo "Before: $SNAP"
      - name: Install Claude Code CLI (model probe)
        run: npm install -g @anthropic-ai/claude-code
      - name: Resolve model (first accessible in preference chain)
        id: model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ROLE: intake
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          CHAIN=$(python3 -c "import json;m=json.load(open('.github/factory-models.json'));v=m.get('$ROLE',['claude-sonnet-5']);print(' '.join(v if isinstance(v,list) else [v]))" 2>/dev/null || echo claude-sonnet-5)
          echo "Preference chain for $ROLE: $CHAIN"
          MODEL=""
          for m in $CHAIN; do
            echo "Probing model access: $m"
            if timeout 120 claude -p "Reply with exactly: OK" --model "$m" --max-turns 1 >/dev/null 2>&1; then
              MODEL="$m"; echo "Selected model: $m"; break
            fi
            echo "::warning::Model $m is not accessible with this credential - trying next in chain"
          done
          if [ -z "$MODEL" ]; then
            echo "::error::No model in the preference chain is accessible - check credentials/plan or edit .github/factory-models.json"
            exit 1
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
      - name: Run intake role
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          OPENSPEC_TELEMETRY: "0"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Events the factory itself raised reach a role - see the agent job.
          allowed_bots: ${{ inputs.allowed_bots }}
          prompt: |
            You are running the "intake" role of the Software Factory inside
            GitHub Actions, on repository ${{ github.repository }}. This issue
            was released as part of an approved release milestone (gate G0), so
            it is one of several intakes running in parallel — stay strictly
            inside your own issue.

            The factory handbook and your role instructions follow verbatim
            below. Execute the role instructions, treating number
            ${{ matrix.issue }} as the issue argument ($ARGUMENTS).

            Repo-specific facts (stack, test/build commands, conventions) live
            in .factory/profile.json in the checked-out repository.

            Operating rules:
            - Use the gh CLI for GitHub operations (labels, comments, PRs); GH_TOKEN is set.
            - HARD RULES: never push to main or master; never merge a pull request;
              perform exactly one factory role in this run.
            - End EVERY comment you post on an issue or PR with a line containing
              exactly: <!-- factory-agent -->
            - `factory:in-progress` is the pipeline's own "a run is live" marker
              on your issue. Ignore it, and never add or remove it yourself.

            ===== FACTORY HANDBOOK =====

            ${{ steps.roledef.outputs.text }}
          claude_args: |
            --max-turns 100
            --model ${{ steps.model.outputs.model }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,TodoWrite,Task,Skill"
      - name: Verify the role changed something (no-op guard)
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          ISSUE: ${{ matrix.issue }}
          BEFORE: ${{ steps.before.outputs.snap }}
        run: |
          AFTER=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" \
                    --jq '"\(.comments)|\([.labels[].name | select(startswith("factory:")) | select(. != "factory:in-progress")] | sort | join(","))"')
          echo "Before: $BEFORE"
          echo "After:  $AFTER"
          if [ "$AFTER" != "$BEFORE" ]; then
            echo "Role 'intake' left a trace on #$ISSUE."
            exit 0
          fi
          DENIALS=$(jq -r '[.. | objects | select(has("permission_denials_count")) | .permission_denials_count] | last // 0' \
                      "$RUNNER_TEMP/claude-execution-output.json" 2>/dev/null || echo 0)
          [ -n "$DENIALS" ] || DENIALS=0
          HINT="Check the role's own log above for where it stopped."
          if [ "$DENIALS" -gt 0 ]; then
            HINT="$DENIALS tool permission denial(s) were recorded - the --allowedTools list in this workflow is the likely cause."
          fi
          echo "::error::Role 'intake' finished but changed nothing on #$ISSUE - no factory:* label change and no new comment. $HINT"
          exit 1
      - name: Say what happens next
        # Every run leaves the issue saying what is expected of the next
        # actor. A role that finished cleanly used to say nothing at all: the
        # label moved and the thread went quiet, and the states with no
        # trigger of their own (in-review, in-test, ready-to-ship) were the
        # pipeline waiting on a human with nothing on the issue to say so.
        #
        # After the no-op guard on purpose — this comment must never be the
        # "visible trace" that lets a role which did nothing pass for one that
        # worked. github.token, like every other notice here: a comment from
        # the workflow token emits no events and can never trigger a run.
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.issue }}
          ROLE: intake
        run: python3 "$RUNNER_TEMP/factory/scripts/say_next_step.py"
      - name: Clear the in-progress marker
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.issue }}
        run: |
          gh api -X DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels/factory%3Ain-progress" \
            >/dev/null 2>&1 || true
          echo "Cleared factory:in-progress from #$ISSUE."

  architect-chain:
    needs: [route, agent]
    if: needs.agent.result == 'success' && needs.route.outputs.role == 'planner'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify planner advanced the epic to factory:planned
        id: gate
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/issues/${{ needs.route.outputs.issue }}" --jq '.labels[].name' | grep -qx 'factory:planned'; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Planner did not reach factory:planned (blocked or split) - not chaining architect."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mark the epic in progress
        # See the same step in the `agent` job. The planner's run cleared the
        # marker on its way out; the architect is a second role on the same
        # epic, so it re-marks it for the duration of its own run.
        if: steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.issue }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/labels" \
            -f name='factory:in-progress' -f color='1F6FEB' \
            -f description='A factory agent run is live on this issue right now' \
            >/dev/null 2>&1 || true
          echo '{"labels":["factory:in-progress"]}' | gh api -X POST \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels" --input - >/dev/null
          echo "Marked #$ISSUE factory:in-progress for the architect run."
      - uses: actions/checkout@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          fetch-depth: 0
      - name: Start the architect on the epic branch (§6b)
        if: steps.gate.outputs.proceed == 'true'
        env:
          ISSUE: ${{ needs.route.outputs.issue }}
        run: |
          # Same rule as the agent job: with epics:true the change folder
          # lives on factory/epic-<epic> (FACTORY.md §6b).
          EPICS=$(python3 -c "
          import json
          try: print(json.load(open('.github/factory-branches.json')).get('epics') is True)
          except Exception: print(False)" 2>/dev/null || echo False)
          if [ "$EPICS" != "True" ]; then
            echo "Epic-branch policy off - default checkout kept"; exit 0
          fi
          BR="factory/epic-$ISSUE"
          if git fetch origin "$BR" 2>/dev/null; then
            git checkout -B "$BR" FETCH_HEAD
            echo "Checked out epic branch $BR"
          else
            echo "No $BR on the remote (pre-flip epic?) - default checkout kept"
          fi
      - name: Load factory role definition
        if: steps.gate.outputs.proceed == 'true'
        id: roledef
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_REPO_INPUT: ${{ inputs.factory_repo }}
          FACTORY_REF: ${{ inputs.factory_ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          # Factory resolution mirrors the agent job: referenced workflows name
          # the repo the uses: line resolved to; workflow_ref names the caller.
          FACTORY_REPO="${FACTORY_REPO_INPUT:-}"
          if [ -z "$FACTORY_REPO" ]; then
            FACTORY_REPO=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --jq '[.referenced_workflows[]?.path | select(contains(".github/workflows/factory-pipeline.yml"))][0] // ""' \
              2>/dev/null | cut -d/ -f1-2)
          fi
          if [ -z "$FACTORY_REPO" ]; then
            FACTORY_REPO=$(printf '%s' "$WORKFLOW_REF" | cut -d/ -f1-2)
          fi
          echo "Cloning factory $FACTORY_REPO@$FACTORY_REF"
          if ! GIT_TERMINAL_PROMPT=0 git clone --depth 1 --branch "$FACTORY_REF" \
              "https://github.com/$FACTORY_REPO" "$RUNNER_TEMP/factory"; then
            echo "::error::Could not clone https://github.com/$FACTORY_REPO (ref $FACTORY_REF). Pass factory_repo on the caller stub — the same owner/repo as the uses: line. A missing repository looks like: fatal: could not read Username for 'https://github.com'."
            exit 1
          fi
          {
            echo 'text<<FACTORY_DEF_EOF'
            cat "$RUNNER_TEMP/factory/FACTORY.md"
            printf '\n\n===== ROLE INSTRUCTIONS (architect) =====\n\n'
            cat "$RUNNER_TEMP/factory/commands/architect.md"
            echo 'FACTORY_DEF_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Install Claude Code CLI (model probe)
        if: steps.gate.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Resolve architect model (first accessible in preference chain)
        if: steps.gate.outputs.proceed == 'true'
        id: model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ROLE: architect
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          CHAIN=$(python3 -c "import json;m=json.load(open('.github/factory-models.json'));v=m.get('$ROLE',['claude-sonnet-5']);print(' '.join(v if isinstance(v,list) else [v]))" 2>/dev/null || echo claude-sonnet-5)
          echo "Preference chain for $ROLE: $CHAIN"
          MODEL=""
          for m in $CHAIN; do
            echo "Probing model access: $m"
            if timeout 120 claude -p "Reply with exactly: OK" --model "$m" --max-turns 1 >/dev/null 2>&1; then
              MODEL="$m"; echo "Selected model: $m"; break
            fi
            echo "::warning::Model $m is not accessible with this credential - trying next in chain"
          done
          if [ -z "$MODEL" ]; then
            echo "::error::No model in the preference chain is accessible - check credentials/plan or edit .github/factory-models.json"
            exit 1
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
      - name: Run architect role
        if: steps.gate.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          OPENSPEC_TELEMETRY: "0"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Events the factory itself raised reach a role - see the agent job.
          allowed_bots: ${{ inputs.allowed_bots }}
          prompt: |
            You are running the "architect" role of the Software Factory inside
            GitHub Actions (chained after the planner), on repository
            ${{ github.repository }}.

            The factory handbook and your role instructions follow verbatim
            below. Execute them, treating number
            ${{ needs.route.outputs.issue }} as the epic issue argument
            ($ARGUMENTS).

            Operating rules:
            - Use the gh CLI for GitHub operations; GH_TOKEN is set.
            - HARD RULES: never push to main or master; never merge a pull request.
              End EVERY comment you post with a line containing exactly:
              <!-- factory-agent -->
            - `factory:in-progress` is the pipeline's own "a run is live" marker
              on the epic. Ignore it, and never add or remove it yourself.
            - Cross-repo epics: clone other affected repos with
              `gh repo clone ${{ github.repository_owner }}/<repo> /tmp/<repo>` (GH_TOKEN
              grants access when the FACTORY_CROSS_REPO_TOKEN secret is set) and commit
              each repo's design.md to its own change folder via a factory branch + PR.
              If cross-repo access is missing, comment on the epic and apply
              factory:blocked.

            ===== FACTORY HANDBOOK =====

            ${{ steps.roledef.outputs.text }}
          # Headless runs have no one to answer a permission prompt, so anything
          # not explicitly allowed here is DENIED. Without this block the role
          # reads the repo, then silently fails to run `gh`, write files or
          # commit — the run goes green and the epic sits at its current label.
          # Keep in sync with the same list in factory-test.yml.
          claude_args: |
            --max-turns 100
            --model ${{ steps.model.outputs.model }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,TodoWrite,Task,Skill"
      - name: Say what happens next
        # Every run leaves the issue saying what is expected of the next
        # actor. A role that finished cleanly used to say nothing at all: the
        # label moved and the thread went quiet, and the states with no
        # trigger of their own (in-review, in-test, ready-to-ship) were the
        # pipeline waiting on a human with nothing on the issue to say so.
        #
        # After the no-op guard on purpose — this comment must never be the
        # "visible trace" that lets a role which did nothing pass for one that
        # worked. github.token, like every other notice here: a comment from
        # the workflow token emits no events and can never trigger a run.
        # The gate is part of the condition: when the planner did not reach
        # factory:planned this job skips the architect entirely, and the
        # planner's own run already said what happens next.
        if: success() && steps.gate.outputs.proceed == 'true' && needs.route.outputs.issue != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.issue }}
          ROLE: architect
        run: python3 "$RUNNER_TEMP/factory/scripts/say_next_step.py"
      - name: Clear the in-progress marker
        if: always() && needs.route.outputs.issue != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.issue }}
        run: |
          gh api -X DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels/factory%3Ain-progress" \
            >/dev/null 2>&1 || true
          echo "Cleared factory:in-progress from #$ISSUE."
