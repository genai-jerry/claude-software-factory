        #
        # After the no-op guard on purpose — this comment must never be the
        # "visible trace" that lets a role which did nothing pass for one that
        # worked. github.token, like every other notice here: a comment from
        # the workflow token emits no events and can never trigger a run.
        # The gate is part of the condition: when the planner did not reach
        # factory:planned this job skips the architect entirely, and the
        # planner's own run already said what happens next.
        if: success() && steps.gate.outputs.proceed == 'true' && needs.route.outputs.issue != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.issue }}
          ROLE: architect
        run: python3 "$RUNNER_TEMP/factory/scripts/say_next_step.py"
      - name: Clear the in-progress marker
        if: always() && needs.route.outputs.issue != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.route.outputs.issue }}
        run: |
          gh api -X DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels/factory%3Ain-progress" \
            >/dev/null 2>&1 || true
          echo "Cleared factory:in-progress from #$ISSUE."

  # Expedite (FACTORY.md §4a): the stages that would have waited for a human
  # start themselves. This job is that chain on the Actions engine.
  #
  # It re-dispatches this same workflow, one dispatch per follow-up issue,
  # rather than running the next role in-line the way architect-chain does.
  # Dispatch fans out to N tasks and each task then needs up to four
  # sequential role runs, each with its own model resolution and its own
  # 45-minute budget; a matrix cannot be re-derived mid-run, and one job
  # cannot hold them all. One run per role also means a crashed run costs at
  # most one hop — the next event re-enters the map where it left off.
  #
  # Re-dispatch needs FACTORY_CROSS_REPO_TOKEN: the workflow token cannot
  # start workflows (§2a, GitHub anti-recursion). Without it the chain cannot
  # run at all, so the job says so once on the issue and stops green — never a
  # silent stall, and never a half-applied gate (the token is checked before
  # any side effect, so an epic is not flipped past a gate the chain then
  # cannot follow).
  expedite-chain:
    # Two jobs run roles: `agent` for everything routed, and `release-intake`
    # for the gate-G0 batch (where `agent` is skipped entirely, so keying off
    # it alone left every expedited issue released by a milestone stalled at
    # factory:spec-ready with nothing to advance it).
    needs: [route, agent, architect-chain, release-chain, release-intake]
    if: >-
      always()
      && needs.architect-chain.result != 'failure'
      && (
           (needs.agent.result == 'success'
             && needs.route.outputs.issues != '' && needs.route.outputs.issues != '[]')
           || needs.release-intake.result == 'success'
         )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/github-script@v7
        env:
          RAN_ROLE: ${{ needs.route.outputs.role }}
          RAN_ISSUES: ${{ needs.route.outputs.issues }}
          AGENT_RESULT: ${{ needs.agent.result }}
          ARCHITECT_RESULT: ${{ needs.architect-chain.result }}
          RELEASE_INTAKE_RESULT: ${{ needs.release-intake.result }}
          RELEASED_ISSUES: ${{ needs.release-chain.outputs.issues }}
          CROSS_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const EXPEDITE = 'factory:expedite';
            const IN_PROGRESS = 'factory:in-progress';
            const ORTHOGONAL = [IN_PROGRESS, EXPEDITE, 'factory:blocked'];
            const RELEASE_KIND = 'factory:release';
            const FAST_TRACK = 'factory:fast-track';
            const PROFILE_KIND = 'factory:profile';

            // MUST match the map in the route job's script, in this same file.
            // scripts/test-router.js extracts both and fails if they diverge —
            // the whole point of expedite is that one table decides, and two
            // copies of it in one file is exactly the drift that test exists
            // to catch.
            const EXPEDITE_MAP = {
              'factory:spec-ready': 'gate:spec',
              'factory:design-ready': 'gate:design',
              'factory:ready': 'implementer',
              'factory:in-review': 'reviewer',
              'factory:in-test': 'qa',
              'factory:ready-to-ship': 'release',
            };

            const loadJson = (p) => {
              try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch (e) { return {}; }
            };
            const namesOf = (ls) => (ls || []).map(l => (typeof l === 'string' ? l : l.name));
            const statesOf = (ls) => ls.filter(n => n.startsWith('factory:') &&
              !ORTHOGONAL.includes(n) && n !== RELEASE_KIND && n !== FAST_TRACK && n !== PROFILE_KIND);
            const soleState = (ls) => (statesOf(ls).length === 1 ? statesOf(ls)[0] : null);
            const epicsOn = loadJson('.github/factory-branches.json').epics === true;
            const expeditedNext = (state) => {
              const role = EXPEDITE_MAP[state || ''] || null;
              return (role === 'release' && !epicsOn) ? null : role;
            };
            const say = (n, body) => github.rest.issues.createComment({
              owner, repo, issue_number: n, body: `${body}\n\n<!-- factory-agent -->`,
            });
            const defBranch = (context.payload.repository || {}).default_branch || 'main';

            // Which issues this run touched, and with which role — because
            // "the role that just ran" is what stops the chain from repeating
            // itself. Two jobs contribute: `agent` (whatever was routed) and
            // `release-intake` (the gate-G0 batch, where `agent` is skipped).
            // Both can happen in one run when the Scrum Master approves G0
            // itself, so these are merged, not chosen between.
            let ranRole = process.env.RAN_ROLE;
            // The planner chains the architect in-run (architect-chain), so
            // after a planner route it is the architect's result the map follows.
            if (ranRole === 'planner' && process.env.ARCHITECT_RESULT === 'success') ranRole = 'architect';
            const acted = [];
            if (process.env.AGENT_RESULT === 'success') {
              for (const n of JSON.parse(process.env.RAN_ISSUES || '[]')) {
                acted.push({ issue: Number(n), ranRole });
              }
            }
            if (process.env.RELEASE_INTAKE_RESULT === 'success') {
              for (const n of JSON.parse(process.env.RELEASED_ISSUES || '[]')) {
                acted.push({ issue: Number(n), ranRole: 'intake' });
              }
            }

            const epicOf = (iss) => {
              const m = /^task\((\d+)\)/.exec(iss.title || '');
              return m ? Number(m[1]) : null;
            };
            const isExpedited = async (iss) => {
              if (namesOf(iss.labels).includes(EXPEDITE)) return true;
              const epic = epicOf(iss);
              if (epic === null) return false;
              // Cross-repo epics are left to the epic's own repo: this run can
              // only dispatch into repos its token reaches, and the task-closed
              // path already says on the task what to run over there (§7).
              const { data: parent } = await github.rest.issues.get({
                owner, repo, issue_number: epic,
              }).catch(() => ({ data: null })) || {};
              return parent ? namesOf(parent.labels).includes(EXPEDITE) : false;
            };

            // Work out every follow-up first, and only then check we can act
            // on it. A gate approval is a side effect: flipping an epic past
            // G1 with no way to start its planner would strand it worse than
            // leaving the gate shut.
            const followUps = [];
            for (const { issue: n, ranRole: was } of acted) {
              const { data: iss } = await github.rest.issues.get({
                owner, repo, issue_number: n,
              }).catch(() => ({ data: null })) || {};
              if (!iss) continue;
              const labels = namesOf(iss.labels);
              if (labels.includes('factory:blocked')) {
                core.info(`#${n} is factory:blocked - expedite does not advance it`);
                continue;
              }
              if (!(await isExpedited(iss))) continue;
              const state = soleState(labels);
              const next = expeditedNext(state);
              if (next) {
                // The dispatch-storm guard. If the map names the role that
                // just ran, this run did not move the issue on (a no-op, or a
                // role that left the state alone) and dispatching it again
                // would repeat it forever.
                if (next === was) {
                  core.info(`#${n} is still at ${state} after ${was} - not re-dispatching the same role`);
                } else {
                  followUps.push({ issue: n, next, state });
                }
              } else {
                core.info(`#${n} is at ${state || 'no state'} - the map stops here`);
              }
              // The Dispatcher's own state does not advance — its output is on
              // the tasks it just released, so the fan-out is theirs, not its.
              if (was === 'dispatch') {
                const { data: ready } = await github.rest.issues.listForRepo({
                  owner, repo, labels: 'factory:ready', state: 'open', per_page: 100,
                });
                for (const t of ready) {
                  if (t.pull_request) continue;
                  if (epicOf(t) !== n) continue;
                  const ls = namesOf(t.labels);
                  if (ls.includes(IN_PROGRESS) || ls.includes('factory:blocked')) continue;
                  followUps.push({ issue: t.number, next: 'implementer', state: 'factory:ready' });
                }
              }
            }

            if (!followUps.length) {
              core.info('Nothing to chain.');
              return;
            }
            if (!process.env.CROSS_TOKEN) {
              // Say it once per issue, not once per hop: a chain that cannot
              // run would otherwise repeat this on every stage.
              const marker = '<!-- factory-expedite-no-token -->';
              for (const f of new Map(followUps.map(f => [f.issue, f])).values()) {
                const { data: said } = await github.rest.issues.listComments({
                  owner, repo, issue_number: f.issue, per_page: 100,
                }).catch(() => ({ data: [] }));
                if (said.some(c => (c.body || '').includes(marker))) continue;
                await say(f.issue,
                  'This issue is expedited, but auto-advance needs the `FACTORY_CROSS_REPO_TOKEN` ' +
                  'secret on the GitHub Actions engine: the workflow token cannot start workflow ' +
                  'runs, so the factory has no way to start the next stage by itself ' +
                  '(FACTORY.md §4a).\n\n' +
                  `Nothing is broken and nothing was skipped — this issue is at **${f.state}**, and ` +
                  'the normal controls for that state still work: see the hand-off notice on this ' +
                  'thread. Add the secret (a fine-grained PAT with Issues, Contents and Pull ' +
                  'requests) to chain the rest automatically, or run the stages by hand.\n\n' +
                  marker);
              }
              core.info('No FACTORY_CROSS_REPO_TOKEN - said so once and stopping cleanly.');
              return;
            }

            const pat = require('@actions/github').getOctokit(process.env.CROSS_TOKEN);
            for (const f of followUps) {
              let role = f.next;
              if (role.startsWith('gate:')) {
                // Gates G1/G2 approving themselves. The merge-and-flip is the
                // route job's approveGate; here the same two calls are made
                // through the PAT so the flip emits real events too.
                const spec = role === 'gate:spec';
                const head = `${owner}:factory/${f.issue}-${spec ? 'spec' : 'design'}`;
                const { data: prs } = await github.rest.pulls.list({
                  owner, repo, state: 'open', head,
                });
                let allMerged = true;
                for (const pr of prs) {
                  await github.rest.pulls.merge({
                    owner, repo, pull_number: pr.number, merge_method: 'squash',
                  }).then(() => core.info(`Merged gate PR #${pr.number}`)).catch(async (e) => {
                    allMerged = false;
                    await say(f.issue,
                      `This epic is expedited, but PR #${pr.number} could not be merged ` +
                      `automatically (${e.message}). Merge it yourself and apply the next label — ` +
                      'the chain picks up from there.');
                  });
                }
                if (!allMerged) continue;
                // The flip MUST go through the workflow token, not the PAT.
                // A PAT-applied `factory:spec-approved` emits a real labeled
                // event (§2a), which the router maps straight to the planner —
                // and this job then dispatches the planner too. Two planners,
                // same epic, same branch. The workflow token emits nothing, so
                // the dispatch below is the only start.
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: f.issue,
                  name: spec ? 'factory:spec-ready' : 'factory:design-ready',
                }).catch(() => {});
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: f.issue,
                  labels: [spec ? 'factory:spec-approved' : 'factory:design-approved'],
                });
                role = spec ? 'planner' : 'dispatch';
                core.info(`Gate ${spec ? 'G1' : 'G2'} approved automatically on #${f.issue} (expedited)`);
              }
              await pat.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'factory-pipeline.yml', ref: defBranch,
                inputs: { role, issue_number: String(f.issue) },
              }).then(() => {
                core.info(`Expedited #${f.issue}: dispatched ${role}`);
              }).catch(async (e) => {
                await say(f.issue,
                  `This issue is expedited and the next stage is \`${role}\`, but starting it ` +
                  `failed: ${e.message}.\n\n` +
                  `Start it by hand: Actions → "Factory pipeline" → Run workflow (role: \`${role}\`, ` +
                  `issue \`${f.issue}\`).`);
                core.info(`Dispatch of ${role} for #${f.issue} failed: ${e.message}`);
              });
            }
