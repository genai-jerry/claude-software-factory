          import json
          try: print(json.load(open('.github/factory-branches.json')).get('epics') is True)
          except Exception: print(False)" 2>/dev/null || echo False)
          STAGING=$(python3 -c "
          import json
          def load(p):
              try: return json.load(open(p))
              except Exception: return {}
          prof = (load('.factory/profile.json').get('branches') or {}).get('staging')
          pol = load('.github/factory-branches.json')
          if isinstance(prof, str) and prof: print(prof)
          elif pol.get('required') is False: print('')
          else:
              s = pol.get('staging')
              print(s if isinstance(s, str) and s else 'staging')" 2>/dev/null || echo staging)
          if [ "$EPICS" = "True" ]; then
            BR="factory/epic-$ISSUE"
            if git fetch origin "$BR" 2>/dev/null; then
              git checkout -B "$BR" FETCH_HEAD
              echo "Checked out epic branch $BR"; exit 0
            fi
            echo "No $BR on the remote (pre-flip epic?) - trying the integration branch"
          fi
          if [ -n "$STAGING" ] && git fetch origin "$STAGING" 2>/dev/null && has_folder "$STAGING"; then
            git checkout -B "$STAGING" FETCH_HEAD
            echo "Checked out integration branch $STAGING (§6a)"
          else
            echo "No change folder on ${STAGING:-<none>} - default checkout kept"
          fi
      - name: Load factory role definition
        if: steps.gate.outputs.proceed == 'true'
        id: roledef
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_REPO_INPUT: ${{ inputs.factory_repo }}
          FACTORY_REF: ${{ inputs.factory_ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          # Factory resolution mirrors the agent job: referenced workflows name
          # the repo the uses: line resolved to; workflow_ref names the caller.
