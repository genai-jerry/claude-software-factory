  # A Release Manager run that lands a task on the epic branch unblocks its
  # dependents — and, where system tests are on (FACTORY.md §4b), releases the
  # cases whose code is now assembled. Nothing else observes that: the §2a
  # re-dispatch fires on a task *closing*, which GitHub only does for a merge
  # into the default branch, so under epics:true a merge onto the epic branch
  # released nothing at all. This is that missing edge, and it runs whether or
  # not system tests are on.
  dispatch-chain:
    needs: [route, agent]
    if: needs.agent.result == 'success' && needs.route.outputs.role == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve the epic and check it is still dispatching
        id: gate
        env:
          GH_TOKEN: ${{ secrets.FACTORY_CROSS_REPO_TOKEN || github.token }}
          RAN_ON: ${{ needs.route.outputs.issue }}
        run: |
          # The Release Manager is started on a task (the factory:ready-to-ship
          # hand-off) or on the epic itself (gate GS). Either way the dispatch
          # belongs to the epic: a task title names it, and anything else IS
          # the epic.
          TITLE=$(gh api "repos/$GITHUB_REPOSITORY/issues/$RAN_ON" --jq '.title' 2>/dev/null || echo "")
          EPIC=$(printf '%s' "$TITLE" | sed -n 's/^task(\([0-9]\{1,\}\)).*/\1/p')
          [ -n "$EPIC" ] || EPIC="$RAN_ON"
          echo "epic=$EPIC" >> "$GITHUB_OUTPUT"
          # Only while the epic is in its implementation phase, exactly like
          # the task-closed re-dispatch: past it (or short of it) a dispatch
          # has nothing to release.
          if gh api "repos/$GITHUB_REPOSITORY/issues/$EPIC" --jq '.labels[].name' 2>/dev/null | grep -qx 'factory:design-approved'; then
