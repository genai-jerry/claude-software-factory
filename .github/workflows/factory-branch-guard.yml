name: Factory branch guard (reusable)

# Detection layer for FACTORY.md §8a: GitHub branch protection needs a paid
# plan, so this flags any commit that lands on a protected branch without a
# pull request (i.e. a direct push). Prevention is handled agent-side by the
# protect-branches PreToolUse hook shipped with the plugin.
#
# It also reports the §6a case: a commit that DID arrive by PR, but from a head
# branch other than the org's integration branch — a change that reached the
# default branch without being proved on staging first. Document PRs are the
# documented exception (FACTORY.md §6) and are recognised by their diff, so
# they are not reported.
#
# Called from a stub with `on: push: branches: [main, master]`; see
# templates/workflows/factory-branch-guard.yml.

on:
  workflow_call:
    inputs:
      incident_label:
        description: "Label applied to the issue filed for a direct push."
        required: false
        type: string
        default: "factory:incident"

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Read the integration-branch policy
        # The policy file is the org's (FACTORY.md §6a); the profile may
        # override the branch NAME for this repo. Both live in the repo being
        # guarded, so read them from the checkout rather than guessing.
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/factory-branches.json
            .factory/profile.json
          sparse-checkout-cone-mode: false
      - name: Resolve the integration branch
        id: policy
        run: |
          python3 - > "$RUNNER_TEMP/branch-policy" <<'PY'
          import json

          def load(path):
              try:
                  with open(path) as fh:
                      return json.load(fh)
              except Exception:
                  return {}

          policy = load(".github/factory-branches.json")
          profile_branches = load(".factory/profile.json").get("branches") or {}
          override = profile_branches.get("staging")
          name = override if isinstance(override, str) and override else None
          if not name:
              name = policy.get("staging") or "staging"
          print(f"integration={name}")
          print("required=" + ("false" if policy.get("required") is False else "true"))
          PY
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/branch-policy"
      - name: Verify push came from a pull request
        uses: actions/github-script@v7
        env:
          INCIDENT_LABEL: ${{ inputs.incident_label }}
          INTEGRATION_BRANCH: ${{ steps.policy.outputs.integration }}
          STAGING_REQUIRED: ${{ steps.policy.outputs.required }}
        with:
          script: |
            const sha = context.sha;
            const branch = context.ref.replace('refs/heads/', '');
            const integration = process.env.INTEGRATION_BRANCH;
            const { data: prs } = await github.request(
              'GET /repos/{owner}/{repo}/commits/{sha}/pulls',
              { owner: context.repo.owner, repo: context.repo.repo, sha }
            );
            if (prs.length > 0) {
              const pr = prs[0];
              core.info(`OK: ${sha} is associated with PR #${pr.number}`);
              if (process.env.STAGING_REQUIRED !== 'true') return;
              if (pr.head.ref === integration) {
                core.info(`OK: PR #${pr.number} promoted ${integration} -> ${branch}`);
                return;
              }
              // Document PRs are the documented exception (FACTORY.md §6):
              // they carry no product change, so there is nothing staging
              // could have proved about them.
              const DOC_PATHS = /^(openspec\/|docs\/|wiki\/|FACTORY\.md$|README\.md$|\.claude\/|\.factory\/|\.github\/(workflows\/factory-|factory-|ISSUE_TEMPLATE\/))/;
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: pr.number, per_page: 100,
              }).catch(() => null);
              if (files && files.length > 0 && files.every(f => DOC_PATHS.test(f.filename))) {
                core.info(`OK: PR #${pr.number} is a documents-only PR (${files.length} files)`);
                return;
              }
              // An epic branch merged straight to the default branch is the
              // §6b variant of the same skip: epics reach the default branch
              // only through the integration branch.
              const epicHead = /^factory\/epic-\d+$/.test(pr.head.ref);
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Factory guard: ${branch} changed without a staging promotion (PR #${pr.number})`,
                labels: [process.env.INCIDENT_LABEL],
                body: [
                  `A code change reached \`${branch}\` from \`${pr.head.ref}\` rather than from the`,
                  `integration branch \`${integration}\`, so it was never proved on staging.`,
                  ``,
                  ...(epicHead ? [
                    `\`${pr.head.ref}\` is an **epic branch** (FACTORY.md §6b): a completed epic merges to`,
                    `\`${integration}\` via its integration PR and reaches \`${branch}\` only in a promotion PR.`,
                    `Merging the epic branch here skipped the staging proof entirely.`,
                    ``,
                  ] : []),
                  `- Commit: ${sha}`,
                  `- Pull request: #${pr.number}`,
                  `- Head branch: \`${pr.head.ref}\``,
                  ``,
                  `Per FACTORY.md §6a every implementation PR merges onto \`${integration}\` first, and`,
                  `only a promotion PR from that branch reaches \`${branch}\`. This is a detection, not a`,
                  `block — a human may merge whatever they judge necessary — but it should not be silent.`,
                  ``,
                  `If this was a deliberate hotfix or a documents-only change the guard did not recognise,`,
                  `close this issue with a note. Otherwise: make sure \`${integration}\` carries the same`,
                  `commit, so the next promotion PR does not revert it.`,
                  ``,
                  `---`,
                  `_Generated by [Claude Code](https://claude.ai/code)_`
                ].join('\n')
              });
              core.warning(`PR #${pr.number} landed on ${branch} without going through ${integration}`);
              return;
            }
            const pusher = context.payload.pusher?.name || 'unknown';
            const title = `Factory guard: direct push to ${context.ref.replace('refs/heads/','')} (${sha.substring(0,7)})`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: [process.env.INCIDENT_LABEL],
              body: [
                `A commit landed on a protected branch without an associated pull request.`,
                ``,
                `- Commit: ${sha}`,
                `- Pushed by: ${pusher}`,
                `- Compare: ${context.payload.compare || 'n/a'}`,
                ``,
                `Per FACTORY.md §8a, protected branches only change via human-merged PRs (gate G3).`,
                `If this push was intentional (e.g. an emergency hotfix by a human), close this issue with a note.`,
                ``,
                `---`,
                `_Generated by [Claude Code](https://claude.ai/code)_`
              ].join('\n')
            });
            core.setFailed(`Direct push to protected branch detected: ${sha}`);
